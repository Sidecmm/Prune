name: Prune Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "core/**"
      - "Fathom/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    name: Android ARM64 NEON
    runs-on: ubuntu-24.04

    env:
      ANDROID_API: "24"
      NDK_VERSION: "27.2.12479018"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. HOST TOOLS
      #
      # These are for the GitHub x86_64 runner.
      #
      # aarch64-linux-gnu-g++:
      #   Builds the ARM64 Linux permutation utility.
      #
      # qemu-aarch64-static:
      #   Executes that ARM64 utility on the x86 runner.
      # ============================================================
      - name: Install host tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            make \
            curl \
            file \
            binutils-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            qemu-user-static


      # ============================================================
      # 3. LOCATE GITHUB'S ANDROID SDK
      #
      # We deliberately DO NOT use setup-android@v3.
      #
      # The runner already contains an Android SDK.
      # ============================================================
      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"

          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"

          elif [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"

          else
            echo "ERROR: Android SDK was not found."
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "Android SDK:"
          echo "$SDK"

          echo
          echo "SDK contents:"
          ls -lah "$SDK"


      # ============================================================
      # 4. LOCATE SDKMANAGER
      # ============================================================
      - name: Locate sdkmanager
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null \
            | sort \
            | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."

            find "$SDK" \
              -maxdepth 4 \
              -type f \
              | head -100

            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version


      # ============================================================
      # 5. ACCEPT LICENSES
      # ============================================================
      - name: Accept Android licenses
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "Android licenses accepted."


      # ============================================================
      # 6. INSTALL ANDROID PLATFORM + NDK
      #
      # IMPORTANT:
      #
      # We do NOT install:
      #
      #   tools
      #
      # because that package is obsolete.
      # ============================================================
      - name: Install Android NDK
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${NDK_VERSION}"


      # ============================================================
      # 7. VERIFY NDK
      # ============================================================
      - name: Verify NDK
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

          if [ ! -d "$NDK" ]; then
            echo "ERROR: NDK was not installed:"
            echo "$NDK"
            exit 1
          fi

          echo "NDK:"
          echo "$NDK"

          ls -lah "$NDK"


      # ============================================================
      # 8. CONFIGURE ANDROID TOOLCHAIN
      # ============================================================
      - name: Configure Android toolchain
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CC="$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang"
          CXX="$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang++"
          AR="$TOOLCHAIN/llvm-ar"
          STRIP="$TOOLCHAIN/llvm-strip"

          test -x "$CC"
          test -x "$CXX"

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

          echo "ANDROID_CC=$CC" >> "$GITHUB_ENV"
          echo "ANDROID_CXX=$CXX" >> "$GITHUB_ENV"

          echo "ANDROID_AR=$AR" >> "$GITHUB_ENV"
          echo "ANDROID_STRIP=$STRIP" >> "$GITHUB_ENV"

          echo
          echo "Android C compiler:"
          echo "$CC"

          echo
          echo "Android C++ compiler:"
          echo "$CXX"


      # ============================================================
      # 9. VERIFY COMPILER
      #
      # Modern NDK Clang reports:
      #
      #   aarch64-unknown-linux-android24
      #
      # not necessarily:
      #
      #   aarch64-linux-android24
      #
      # Both are valid.
      # ============================================================
      - name: Verify Android ARM64 compiler
        shell: bash
        run: |
          set -e

          echo "Compiler:"
          "$ANDROID_CXX" --version

          echo
          echo "Compiler target:"

          TARGET=$("$ANDROID_CXX" -dumpmachine)

          echo "$TARGET"

          echo
          echo "Checking Android ARM64 target..."

          echo "$TARGET" \
            | grep -Eq '^aarch64-(unknown-)?linux-android'

          echo
          echo "PASS: Android ARM64 compiler detected."


      # ============================================================
      # 10. DOWNLOAD PRUNE NNUE
      # ============================================================
      - name: Download Prune NNUE
        working-directory: core
        shell: bash
        run: |
          set -e

          RELEASE=$(head -n 1 nn-name.txt)
          NETNAME=$(tail -n 1 nn-name.txt)

          echo "Release:"
          echo "$RELEASE"

          echo
          echo "Network:"
          echo "$NETNAME"

          curl -fL \
            -o "${NETNAME}.bin" \
            "https://github.com/tgirolami09/Prune-nets/releases/download/${RELEASE}/${NETNAME}.bin"

          test -s "${NETNAME}.bin"

          echo
          echo "Downloaded network:"
          ls -lh "${NETNAME}.bin"

          echo
          echo "Network SHA256:"
          sha256sum "${NETNAME}.bin"


      # ============================================================
      # 11. BUILD ARM64 LINUX PERMUTE
      #
      # This is deliberately NOT compiled with Android clang.
      #
      # It is an ARM64 Linux executable so QEMU can execute it.
      #
      # This makes the ARM NEON path in permute.cpp active.
      # ============================================================
      - name: Build ARM64 NEON permute
        working-directory: core
        shell: bash
        run: |
          set -e

          rm -f permute-arm64

          echo "Building ARM64 permute utility..."

          aarch64-linux-gnu-g++ \
            -O3 \
            -std=gnu++17 \
            -static \
            -o permute-arm64 \
            permute.cpp

          chmod +x permute-arm64

          echo
          echo "permute-arm64:"
          file permute-arm64

          echo
          echo "ELF:"
          readelf -h permute-arm64 \
            | grep -E \
              "Class:|Machine:|Type:"


      # ============================================================
      # 12. GENERATE ARM NEON MODEL
      #
      # QEMU runs the ARM64 permute program.
      #
      # This is important for producing model.bin using Prune's
      # ARM/NEON permutation layout.
      # ============================================================
      - name: Generate ARM NEON model.bin
        working-directory: core
        shell: bash
        run: |
          set -e

          NETNAME=$(tail -n 1 nn-name.txt)

          rm -f model.bin

          echo "Generating model.bin..."

          qemu-aarch64-static \
            ./permute-arm64 \
            "${NETNAME}.bin" \
            model.bin

          test -s model.bin

          echo
          echo "Generated model.bin:"
          ls -lh model.bin

          echo
          echo "model.bin SHA256:"
          sha256sum model.bin


      # ============================================================
      # 13. VERIFY ARM NEON CODE
      # ============================================================
      - name: Verify ARM NEON permutation source
        working-directory: core
        shell: bash
        run: |
          set -e

          if ! grep -q "__ARM_NEON__" permute.cpp; then
            echo "ERROR: ARM NEON path not found in permute.cpp."
            exit 1
          fi

          echo "PASS: ARM NEON path exists in permute.cpp."


      # ============================================================
      # 14. PREPARE MAKEFILE
      #
      # Original Prune Makefile contains x86-specific -m64.
      # Remove that flag only.
      # ============================================================
      - name: Prepare Makefile
        working-directory: core
        shell: bash
        run: |
          set -e

          cp Makefile Makefile.android.original

          sed -i 's/ -m64//g' Makefile

          echo "Checking for remaining -m64:"
          grep -n -- "-m64" Makefile || true


      # ============================================================
      # 15. CLEAN BUILD
      # ============================================================
      - name: Clean build
        working-directory: core
        shell: bash
        run: |
          set -e

          make clean || true

          find . -type f \
            \( -name "*.o" -o -name "*.a" \) \
            -delete

          rm -f prune
          rm -f prune-android-arm64-neon

          test -s model.bin


      # ============================================================
      # 16. COMPILE PRUNE FOR ANDROID ARM64 NEON
      #
      # Target:
      #
      #   ARMv8.2-A + DotProd
      #
      # This is appropriate for your Galaxy A16 5G's ARM64 CPU
      # configuration.
      # ============================================================
      - name: Compile Prune Android ARM64 NEON
        working-directory: core
        shell: bash
        run: |
          set -e

          export CC="$ANDROID_CC"
          export CXX="$ANDROID_CXX"

          CFLAGS="-O3 -flto -funroll-loops -march=armv8.2-a+dotprod -fPIC"

          CXXFLAGS="-O3 -flto -funroll-loops -march=armv8.2-a+dotprod -fPIC"

          LDFLAGS="-flto -march=armv8.2-a+dotprod -static-libstdc++"

          echo "CC:"
          echo "$CC"

          echo
          echo "CXX:"
          echo "$CXX"

          echo
          echo "CFLAGS:"
          echo "$CFLAGS"

          echo
          echo "CXXFLAGS:"
          echo "$CXXFLAGS"

          echo
          echo "LDFLAGS:"
          echo "$LDFLAGS"

          echo
          echo "========================================"
          echo "STARTING PRUNE COMPILATION"
          echo "========================================"

          make -B prune \
            CC="$CC" \
            CXX="$CXX" \
            CFLAGS="$CFLAGS" \
            CXXFLAGS="$CXXFLAGS" \
            LDFLAGS="$LDFLAGS"


      # ============================================================
      # 17. LOCATE BINARY
      # ============================================================
      - name: Locate Prune binary
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Core directory:"
          ls -lah

          PRUNE=$(find . -maxdepth 1 \
            -type f \
            -name "prune*" \
            ! -name "*.o" \
            ! -name "*.d" \
            ! -name "*.bin" \
            ! -name "permute*" \
            | head -n 1)

          if [ -z "$PRUNE" ]; then
            echo
            echo "ERROR: Prune executable was not found."
            exit 1
          fi

          echo
          echo "Found:"
          echo "$PRUNE"

          cp "$PRUNE" prune-android-arm64-neon

          chmod +x prune-android-arm64-neon


      # ============================================================
      # 18. VERIFY AARCH64 ELF
      # ============================================================
      - name: Verify AArch64 ELF
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Binary:"
          file prune-android-arm64-neon

          echo
          echo "ELF header:"

          readelf -h prune-android-arm64-neon \
            | grep -E \
              "Class:|Data:|Type:|Machine:"

          MACHINE=$(readelf -h prune-android-arm64-neon \
            | awk -F: '/Machine:/ {print $2}')

          echo
          echo "Machine:"
          echo "$MACHINE"

          echo "$MACHINE" | grep -qi "AArch64"

          echo
          echo "PASS: binary is AArch64."


      # ============================================================
      # 19. INSPECT DEPENDENCIES
      # ============================================================
      - name: Inspect binary dependencies
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Dynamic dependencies:"

          readelf -d prune-android-arm64-neon \
            | grep NEEDED \
            || true

          echo
          echo "Architecture attributes:"

          readelf -A prune-android-arm64-neon \
            || true


      # ============================================================
      # 20. INSPECT ARM SIMD INSTRUCTIONS
      # ============================================================
      - name: Inspect ARM NEON instructions
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Searching binary for ARM SIMD instructions..."

          aarch64-linux-gnu-objdump \
            -d prune-android-arm64-neon \
            | grep -E \
              "sdot|udot|addv|ld1|st1|smull|smlal|umull|umlal" \
            | head -50 \
            || true


      # ============================================================
      # 21. FINAL VALIDATION
      # ============================================================
      - name: Final validation
        working-directory: core
        shell: bash
        run: |
          set -e

          test -x prune-android-arm64-neon
          test -s model.bin

          echo
          echo "=============================================="
          echo " PRUNE ANDROID ARM64 NEON BUILD SUCCESS"
          echo "=============================================="

          echo
          echo "Binary:"
          ls -lh prune-android-arm64-neon

          echo
          echo "Model:"
          ls -lh model.bin

          echo
          echo "SHA256:"
          sha256sum \
            prune-android-arm64-neon \
            model.bin

          echo
          echo "File:"
          file prune-android-arm64-neon


      # ============================================================
      # 22. PACKAGE ARTIFACT
      # ============================================================
      - name: Package Android build
        shell: bash
        run: |
          set -e

          mkdir -p android-artifact

          cp core/prune-android-arm64-neon \
            android-artifact/

          cp core/model.bin \
            android-artifact/

          cp core/nn-name.txt \
            android-artifact/

          sha256sum \
            android-artifact/prune-android-arm64-neon \
            android-artifact/model.bin \
            > android-artifact/SHA256SUMS.txt

          echo
          echo "Artifact contents:"
          ls -lah android-artifact


      # ============================================================
      # 23. UPLOAD
      # ============================================================
      - name: Upload Android ARM64 NEON
        uses: actions/upload-artifact@v4
        with:
          name: prune-android-arm64-neon
          path: android-artifact/
          if-no-files-found: error
