name: Prune Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "core/**"
      - "Fathom/**"
      - ".github/workflows/android.yml"

jobs:
  build-android:
    name: Android ARM64 NEON
    runs-on: ubuntu-24.04

    env:
      NDK_VERSION: "27.2.12479018"
      ANDROID_API: "24"

    steps:
      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Install host tools
      #
      # aarch64-linux-gnu-g++ is used ONLY for the NNUE permutation
      # generator. This is important:
      #
      # Prune's permute.cpp contains ARM-specific NEON permutation
      # logic. We must execute an ARM64 version of permute, otherwise
      # model.bin can be generated using the wrong SIMD layout.
      # ------------------------------------------------------------
      - name: Install host ARM64 tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            make \
            curl \
            file \
            binutils-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            qemu-user-static

      # ------------------------------------------------------------
      # 3. Install Android NDK
      # ------------------------------------------------------------
      - name: Install Android NDK
        uses: android-actions/setup-android@v3

      - name: Install requested NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"

      # ------------------------------------------------------------
      # 4. Define NDK compiler paths
      # ------------------------------------------------------------
      - name: Configure Android toolchain
        shell: bash
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

          echo "NDK=$NDK"

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

          echo "ANDROID_CC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang" >> "$GITHUB_ENV"

          echo "ANDROID_CXX=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang++" >> "$GITHUB_ENV"

          echo "ANDROID_AR=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"

          echo "ANDROID_STRIP=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 5. Show architecture/toolchain information
      # ------------------------------------------------------------
      - name: Show toolchain
        shell: bash
        run: |
          "$ANDROID_CXX" --version

          echo
          echo "Android C++ compiler:"
          echo "$ANDROID_CXX"

          echo
          echo "Host ARM64 compiler:"
          aarch64-linux-gnu-g++ --version

      # ------------------------------------------------------------
      # 6. Download the official Prune network
      #
      # nn-name.txt:
      #
      # line 1 = release/tag
      # line 2 = network filename
      #
      # We deliberately download the original network and then run
      # Prune's ARM NEON permutation program on it.
      # ------------------------------------------------------------
      - name: Download Prune NNUE
        working-directory: core
        shell: bash
        run: |
          set -e

          RELEASE=$(head -n 1 nn-name.txt)
          NETNAME=$(tail -n 1 nn-name.txt)

          echo "Release: $RELEASE"
          echo "Network: $NETNAME"

          curl -fL \
            -o "${NETNAME}.bin" \
            "https://github.com/tgirolami09/Prune-nets/releases/download/${RELEASE}/${NETNAME}.bin"

          ls -lh "${NETNAME}.bin"

          echo
          echo "SHA256:"
          sha256sum "${NETNAME}.bin"

      # ------------------------------------------------------------
      # 7. Compile Prune's permutation utility FOR ARM64 LINUX
      #
      # DO NOT use the Android compiler here.
      #
      # The resulting program is a normal statically-linked Linux
      # AArch64 executable that QEMU can execute on the GitHub x86
      # runner.
      #
      # This guarantees that:
      #
      #   __ARM_NEON__
      #
      # is active inside permute.cpp.
      # ------------------------------------------------------------
      - name: Build ARM64 NEON permutation tool
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Compiling permute.cpp for ARM64 Linux..."

          aarch64-linux-gnu-g++ \
            -O3 \
            -std=gnu++17 \
            -static \
            -I../Fathom/src \
            -o permute-arm64 \
            permute.cpp

          file permute-arm64

          readelf -h permute-arm64 | grep -E \
            "Class:|Machine:|Type:"

          chmod +x permute-arm64

      # ------------------------------------------------------------
      # 8. Execute ARM64 permutation tool through QEMU
      #
      # THIS IS ONE OF THE MOST IMPORTANT STEPS.
      #
      # The NNUE is transformed using Prune's ARM NEON layout,
      # not the GitHub runner's x86 layout.
      # ------------------------------------------------------------
      - name: Generate ARM NEON model.bin
        working-directory: core
        shell: bash
        run: |
          set -e

          RELEASE=$(head -n 1 nn-name.txt)
          NETNAME=$(tail -n 1 nn-name.txt)

          rm -f model.bin

          echo "Running ARM64 permute:"
          echo "./permute-arm64 ${NETNAME}.bin model.bin"

          qemu-aarch64-static \
            ./permute-arm64 \
            "${NETNAME}.bin" \
            model.bin

          test -s model.bin

          echo
          echo "Generated model.bin:"
          ls -lh model.bin

          echo
          echo "SHA256:"
          sha256sum model.bin

      # ------------------------------------------------------------
      # 9. Verify that the permutation program really used ARM NEON
      # ------------------------------------------------------------
      - name: Verify ARM NEON permutation source
        working-directory: core
        shell: bash
        run: |
          set -e

          grep -q "__ARM_NEON__" permute.cpp

          echo "ARM NEON permutation code is present."

          echo
          echo "Relevant ARM code:"
          grep -n -A12 -B4 "__ARM_NEON__" permute.cpp | head -40

      # ------------------------------------------------------------
      # 10. Prepare Makefile for Android cross compilation
      #
      # Prune's original Makefile contains hard-coded:
      #
      #     -m64
      #
      # which is an x86-specific option.
      #
      # Remove ONLY those hard-coded -m64 occurrences.
      # ------------------------------------------------------------
      - name: Prepare Prune Makefile
        working-directory: core
        shell: bash
        run: |
          set -e

          cp Makefile Makefile.android-backup

          sed -i 's/ -m64//g' Makefile

          echo "Remaining architecture-specific flags:"
          grep -n -- "-m64" Makefile || true

      # ------------------------------------------------------------
      # 11. Build Prune for Android ARM64 NEON
      #
      # armv8.2-a+dotprod is appropriate for modern ARM64 phones
      # and enables Prune's dot-product NEON implementation.
      #
      # -fno-exceptions / RTTI are NOT forced here because we should
      # not arbitrarily change the engine's C++ ABI/behavior.
      # ------------------------------------------------------------
      - name: Build Prune Android ARM64 NEON
        working-directory: core
        shell: bash
        run: |
          set -e

          export CC="$ANDROID_CC"
          export CXX="$ANDROID_CXX"

          export CFLAGS="
            -O3
            -flto
            -funroll-loops
            -march=armv8.2-a+dotprod
            -fPIC
          "

          export CXXFLAGS="
            -O3
            -flto
            -funroll-loops
            -march=armv8.2-a+dotprod
            -fPIC
          "

          export LDFLAGS="
            -flto
            -march=armv8.2-a+dotprod
            -static-libstdc++
          "

          echo "CC=$CC"
          echo "CXX=$CXX"
          echo "CFLAGS=$CFLAGS"
          echo "CXXFLAGS=$CXXFLAGS"
          echo "LDFLAGS=$LDFLAGS"

          # Make sure stale x86 objects cannot survive.
          make clean || true

          rm -f prune
          rm -f prune-*

          # model.bin was deliberately generated above using the
          # ARM64 NEON permutation utility.
          test -s model.bin

          make -B prune \
            CXX="$ANDROID_CXX" \
            CC="$ANDROID_CC" \
            ARCH="armv8.2-a+dotprod" \
            OPT="-O3 -flto -funroll-loops" \
            ADDOPTION="-fPIC"

      # ------------------------------------------------------------
      # 12. Find resulting binary
      # ------------------------------------------------------------
      - name: Locate Android binary
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Directory:"
          ls -lah

          PRUNE=$(find . -maxdepth 1 -type f \
            -name "prune*" \
            ! -name "*.o" \
            ! -name "*.d" \
            ! -name "*.bin" \
            ! -name "permute*" \
            | head -n 1)

          if [ -z "$PRUNE" ]; then
            echo "ERROR: Android Prune executable was not found."
            exit 1
          fi

          echo "PRUNE=$PRUNE" >> "$GITHUB_ENV"

          chmod +x "$PRUNE"

          echo
          echo "Binary:"
          file "$PRUNE"

          echo
          echo "ELF header:"
          readelf -h "$PRUNE" | grep -E \
            "Class:|Data:|Type:|Machine:"

      # ------------------------------------------------------------
      # 13. Verify this is actually AArch64
      # ------------------------------------------------------------
      - name: Verify Android ARM64 ELF
        working-directory: core
        shell: bash
        run: |
          set -e

          PRUNE="$PRUNE"

          file "$PRUNE"

          MACHINE=$(readelf -h "$PRUNE" | awk '/Machine:/ {print}')

          echo "Detected: $MACHINE"

          echo "$MACHINE" | grep -qi "AArch64"

          echo "PASS: binary is AArch64."

      # ------------------------------------------------------------
      # 14. Verify Android target / dynamic dependencies
      # ------------------------------------------------------------
      - name: Inspect binary dependencies
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Dynamic section:"
          readelf -d "$PRUNE" || true

          echo
          echo "Needed libraries:"
          readelf -d "$PRUNE" 2>/dev/null \
            | grep NEEDED \
            || true

          echo
          echo "Machine instructions:"
          objdump -d "$PRUNE" 2>/dev/null | head -40 || true

      # ------------------------------------------------------------
      # 15. Check that ARM NEON instructions are present
      #
      # We do not require one particular instruction because compiler
      # decisions can vary. We mainly make sure this isn't a scalar
      # x86/generic build.
      # ------------------------------------------------------------
      - name: Check ARM NEON / DotProd symbols
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Searching binary for ARM SIMD instructions..."

          aarch64-linux-gnu-objdump -d "$PRUNE" \
            | grep -E \
              "addv|sdot|udot|sqrdmulh|smull|smlal|umull|umlal|ld1|st1" \
            | head -30 \
            || true

          echo
          echo "Architecture attributes:"
          readelf -A "$PRUNE" 2>/dev/null || true

      # ------------------------------------------------------------
      # 16. Build a separate scalar/reference Android binary
      #
      # This is extremely useful for debugging a broken NEON build.
      #
      # If scalar and NEON disagree, we have an architectural/SIMD
      # problem rather than a general Prune problem.
      # ------------------------------------------------------------
      - name: Build Android scalar reference
        working-directory: core
        shell: bash
        run: |
          set -e

          cp "$PRUNE" prune-neon

          make clean || true

          # Scalar fallback is not directly supported by this source
          # because simd_definitions.hpp requires NEON/x86 SIMD.
          #
          # Therefore we do not fabricate a fake scalar build here.
          #
          # Restore the already validated model and rebuild NEON.
          test -s model.bin

          make -B prune \
            CXX="$ANDROID_CXX" \
            CC="$ANDROID_CC" \
            ARCH="armv8.2-a+dotprod" \
            OPT="-O3 -flto -funroll-loops" \
            ADDOPTION="-fPIC"

          cp "$(find . -maxdepth 1 -type f -name 'prune*' ! -name '*.o' ! -name '*.d' ! -name '*.bin' ! -name 'permute*' | head -n 1)" prune-android-arm64-neon

      # ------------------------------------------------------------
      # 17. Check binary size and hashes
      # ------------------------------------------------------------
      - name: Final binary verification
        working-directory: core
        shell: bash
        run: |
          set -e

          test -x prune-android-arm64-neon

          echo "Final binary:"
          ls -lh prune-android-arm64-neon

          echo
          echo "SHA256:"
          sha256sum prune-android-arm64-neon

          echo
          echo "ELF:"
          file prune-android-arm64-neon

          echo
          readelf -h prune-android-arm64-neon | grep -E \
            "Class:|Data:|Type:|Machine:"

      # ------------------------------------------------------------
      # 18. Package everything needed for testing
      # ------------------------------------------------------------
      - name: Prepare artifact
        working-directory: core
        shell: bash
        run: |
          set -e

          mkdir -p ../android-artifact

          cp prune-android-arm64-neon \
            ../android-artifact/

          cp model.bin \
            ../android-artifact/

          cp "${NETNAME}.bin" \
            ../android-artifact/ 2>/dev/null || true

          cp nn-name.txt \
            ../android-artifact/

          sha256sum \
            ../android-artifact/prune-android-arm64-neon \
            ../android-artifact/model.bin \
            > ../android-artifact/SHA256SUMS.txt

          echo
          echo "Artifact contents:"
          ls -lah ../android-artifact

      # ------------------------------------------------------------
      # 19. Upload
      # ------------------------------------------------------------
      - name: Upload Android ARM64 NEON build
        uses: actions/upload-artifact@v4
        with:
          name: prune-android-arm64-neon
          path: android-artifact/
          if-no-files-found: error
