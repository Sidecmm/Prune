name: Prune Android ARM64 NEON

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            clang \
            lld \
            make \
            python3 \
            curl \
            unzip \
            file \
            binutils

      # ============================================================
      # 3. ANDROID SDK / NDK
      # ============================================================
      - name: Install Android NDK
        shell: bash
        run: |
          set -eux

          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"

          echo "SDK root:"
          echo "$SDK_ROOT"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" \
              -type f \
              -name sdkmanager \
              2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-24" \
            "ndk;27.2.12479018"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # ============================================================
      # 4. VERIFY SOURCE
      # ============================================================
      - name: Verify Prune source
        shell: bash
        run: |
          set -eux

          test -f core/Makefile
          test -f core/nn-name.txt
          test -f core/simd_definitions.cpp
          test -f core/simd_definitions.hpp
          test -f core/permute.cpp
          test -f core/embeder.cpp
          test -f core/TranspositionTable.cpp

          echo
          echo "Prune source verified."

          echo
          echo "Network configuration:"
          cat core/nn-name.txt

      # ============================================================
      # 5. PATCH MAKEFILE
      #
      # Prune's Makefile contains hardcoded -m64.
      # Remove it so the Android AArch64 compiler can work.
      # ============================================================
      - name: Patch Makefile for ARM64
        shell: bash
        run: |
          set -eux

          cd core

          python3 <<'PY'
          from pathlib import Path

          path = Path("Makefile")
          text = path.read_text()

          count = text.count(" -m64")

          print(f"Found hardcoded -m64 occurrences: {count}")

          if count:
              text = text.replace(" -m64", "")
              path.write_text(text)
              print(f"Removed {count} hardcoded -m64 occurrences.")
          else:
              print("No hardcoded -m64 found.")
          PY

          echo
          echo "Remaining -m64:"
          grep -nF -- "-m64" Makefile || true

      # ============================================================
      # 6. PATCH ALIGNED ALLOCATION
      # ============================================================
      - name: Patch Android aligned allocation
        shell: bash
        run: |
          set -eux

          cd core

          python3 <<'PY'
          from pathlib import Path

          path = Path("TranspositionTable.cpp")
          text = path.read_text()

          old = "table = (Cluster*)std::aligned_alloc(alignment, size);"

          new = """void* ptr = nullptr;

          if (posix_memalign(&ptr, alignment, size) != 0) {
              ptr = nullptr;
          }

          table = static_cast<Cluster*>(ptr);"""

          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print("Patched std::aligned_alloc -> posix_memalign")

          elif "posix_memalign(&ptr" in text:
              print("posix_memalign patch already present.")

          else:
              print("WARNING:")
              print("Expected aligned_alloc line was not found.")
              print("No allocation patch applied.")
          PY

      # ============================================================
      # 7. INSPECT EMBEDDER
      #
      # Do NOT assume .align 64 exists.
      # ============================================================
      - name: Inspect embeder assembly
        shell: bash
        run: |
          set -eux

          cd core

          echo "=================================================="
          echo "Assembly/alignment directives"
          echo "=================================================="

          grep -nEi \
            '\.(align|p2align|balign)[[:space:]]+' \
            embeder.cpp || true

          echo
          echo "=================================================="
          echo "Inline assembly"
          echo "=================================================="

          grep -nEi \
            'asm|__asm|\.align|\.p2align|\.balign|section|global|globl' \
            embeder.cpp || true

          echo
          echo "No blind alignment replacement will be performed."

      # ============================================================
      # 8. BUILD HOST PERMUTER
      #
      # This utility runs on the GitHub x86_64 runner.
      # It must NOT be an Android binary.
      # ============================================================
      - name: Build host permuter
        shell: bash
        run: |
          set -eux

          cd core

          clang++ \
            -std=gnu++17 \
            -O3 \
            -march=native \
            -flto \
            -funroll-loops \
            -D_CRT_SECURE_NO_WARNINGS \
            -I. \
            permute.cpp \
            -o permute

          echo
          echo "Permuter:"
          file permute

      # ============================================================
      # 9. READ CORRECT NETWORK INFORMATION
      #
      # nn-name.txt:
      #
      # line 1 = release tag
      # line 2 = network filename
      #
      # This is exactly how Prune's Makefile constructs its URL.
      # ============================================================
      - name: Read Prune network information
        shell: bash
        run: |
          set -eux

          cd core

          RELEASE_TAG="$(head -n 1 nn-name.txt | tr -d '\r\n')"
          NETNAME="$(tail -n 1 nn-name.txt | tr -d '\r\n')"

          test -n "$RELEASE_TAG"
          test -n "$NETNAME"

          echo "Release tag:"
          echo "$RELEASE_TAG"

          echo "Network:"
          echo "$NETNAME"

          echo "PRUNE_RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "PRUNE_NETNAME=$NETNAME" >> "$GITHUB_ENV"

      # ============================================================
      # 10. DOWNLOAD NETWORK
      # ============================================================
      - name: Download Prune network
        shell: bash
        run: |
          set -eux

          cd core

          RELEASE_TAG="$PRUNE_RELEASE_TAG"
          NETNAME="$PRUNE_NETNAME"

          URL="https://github.com/tgirolami09/Prune-nets/releases/download/${RELEASE_TAG}/${NETNAME}.bin"

          echo "Downloading:"
          echo "$URL"

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            -o "${NETNAME}.bin" \
            "$URL"

          test -s "${NETNAME}.bin"

          echo
          echo "Downloaded network:"
          ls -lh "${NETNAME}.bin"

          sha256sum "${NETNAME}.bin"

      # ============================================================
      # 11. GENERATE model.bin
      #
      # Use the HOST permuter.
      # Never execute an Android binary here.
      # ============================================================
      - name: Generate model.bin
        shell: bash
        run: |
          set -eux

          cd core

          rm -f model.bin

          ./permute \
            "${PRUNE_NETNAME}.bin" \
            model.bin

          test -s model.bin

          echo
          echo "Generated model.bin:"
          ls -lh model.bin

          sha256sum model.bin

      # ============================================================
      # 12. CONFIGURE ANDROID COMPILER
      # ============================================================
      - name: Configure Android ARM64 compiler
        shell: bash
        run: |
          set -eux

          TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export CC="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"

          test -x "$CC"
          test -x "$CXX"

          echo "CC=$CC"
          echo "CXX=$CXX"

          "$CXX" --version

          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"

      # ============================================================
      # 13. TEST ARM64 NEON
      # ============================================================
      - name: Test ARM64 NEON compiler
        shell: bash
        run: |
          set -eux

          cat > /tmp/neon_test.cpp <<'CPP'
          #include <arm_neon.h>

          int main() {
              uint8x16_t a = vdupq_n_u8(1);
              uint8x16_t b = vdupq_n_u8(2);
              uint8x16_t c = vaddq_u8(a, b);

              return vget_lane_u8(
                  vget_low_u8(c),
                  0
              ) == 3 ? 0 : 1;
          }
          CPP

          "$CXX" \
            -march=armv8.2-a+dotprod \
            -D__ARM_NEON__ \
            -flax-vector-conversions \
            /tmp/neon_test.cpp \
            -o /tmp/neon_test

          file /tmp/neon_test

          readelf -h /tmp/neon_test | grep -E \
            'Class:|Machine:'

      # ============================================================
      # 14. TEST PRUNE SIMD HEADER
      # ============================================================
      - name: Test Prune SIMD
        shell: bash
        run: |
          set -eux

          cd core

          cat > /tmp/prune_simd_test.cpp <<'CPP'
          #include "simd_definitions.hpp"

          int main() {
              return 0;
          }
          CPP

          "$CXX" \
            -std=gnu++17 \
            -O3 \
            -march=armv8.2-a+dotprod \
            -D__ARM_NEON__ \
            -flax-vector-conversions \
            -I. \
            -I../Fathom/src \
            -c \
            /tmp/prune_simd_test.cpp \
            -o /tmp/prune_simd_test.o

          echo "Prune SIMD header passed."

      # ============================================================
      # 15. CLEAN OBJECTS
      #
      # Preserve model.bin and the downloaded network.
      # ============================================================
      - name: Clean old build objects
        shell: bash
        run: |
          set -eux

          cd core

          make clean || true

          rm -f prune
          rm -f *.o
          rm -f *.d

          test -s model.bin

      # ============================================================
      # 16. BUILD FINAL ANDROID ENGINE
      # ============================================================
      - name: Build Prune Android ARM64 NEON DotProd
        shell: bash
        run: |
          set -eux

          cd core

          export CC="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export CXX="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"

          make prune \
            ARCH="armv8.2-a+dotprod" \
            CPUSET="unknow" \
            ADDOPTION="-D__ARM_NEON__ -flax-vector-conversions"

      # ============================================================
      # 17. VERIFY ELF
      # ============================================================
      - name: Verify Android ELF
        shell: bash
        run: |
          set -eux

          cd core

          test -x prune

          echo "=================================================="
          echo "FILE"
          echo "=================================================="

          file prune

          echo
          echo "=================================================="
          echo "ELF HEADER"
          echo "=================================================="

          readelf -h prune | grep -E \
            'Class:|Machine:|OS/ABI:|Type:'

          echo
          echo "=================================================="
          echo "NEEDED LIBRARIES"
          echo "=================================================="

          readelf -d prune | grep NEEDED || true

      # ============================================================
      # 18. CHECK SIMD INSTRUCTIONS
      # ============================================================
      - name: Inspect ARM64 SIMD instructions
        shell: bash
        run: |
          set -eux

          cd core

          llvm-objdump -d prune > /tmp/prune.disasm

          echo "Searching for ARM NEON / DotProd instructions..."

          grep -Ei \
            'sdot|udot|fmla|fmls|umlal|umlsl|cnt|tbl|zip|uzp|ext|ld1|st1' \
            /tmp/prune.disasm \
            | head -n 100 \
            || true

      # ============================================================
      # 19. CHECK NETWORK / EMBEDDING
      # ============================================================
      - name: Verify embedded network
        shell: bash
        run: |
          set -eux

          cd core

          echo "Binary:"
          ls -lh prune

          echo
          echo "Generated model:"
          ls -lh model.bin

          echo
          echo "Network:"
          ls -lh "${PRUNE_NETNAME}.bin"

          echo
          echo "Relevant strings:"
          strings prune | grep -Ei \
            'pulsar|model|nnue|network|prune' \
            | head -n 100 \
            || true

      # ============================================================
      # 20. SHA256
      # ============================================================
      - name: Generate checksum
        shell: bash
        run: |
          set -eux

          cd core

          sha256sum prune

      # ============================================================
      # 21. PACKAGE ARTIFACT
      # ============================================================
      - name: Prepare artifact
        shell: bash
        run: |
          set -eux

          mkdir -p artifact

          cp \
            core/prune \
            artifact/prune-android-arm64-neon-dotprod

          chmod +x \
            artifact/prune-android-arm64-neon-dotprod

          file \
            artifact/prune-android-arm64-neon-dotprod

          sha256sum \
            artifact/prune-android-arm64-neon-dotprod

      # ============================================================
      # 22. UPLOAD BINARY
      # ============================================================
      - name: Upload Android binary
        uses: actions/upload-artifact@v4
        with:
          name: prune-android-arm64-neon-dotprod
          path: artifact/prune-android-arm64-neon-dotprod

      # ============================================================
      # 23. AUTO COMMIT / PUSH SOURCE PATCHES
      #
      # [skip ci] prevents the bot's own commit from triggering
      # another build.
      # ============================================================
      - name: Auto-commit and push patches
        if: always()
        shell: bash
        run: |
          set -eux

          echo "Repository status:"
          git status --short

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            core/Makefile \
            core/TranspositionTable.cpp \
            core/embeder.cpp

          if git diff --cached --quiet; then
            echo "No tracked source patches to commit."
            exit 0
          fi

          git commit \
            -m "Auto-patch Prune for Android ARM64 [skip ci]"

          git push

          echo
          echo "=============================================="
          echo "SOURCE PATCHES PUSHED"
          echo "=============================================="
