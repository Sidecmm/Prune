name: Prune Android ARM64 NEON

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            make \
            curl \
            file \
            binutils \
            qemu-user-static \
            unzip

      - name: Locate Android NDK
        shell: bash
        run: |
          set -eux

          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK/cmdline-tools" "$SDK/tools" -name sdkmanager -type f 2>/dev/null | head -1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-24" \
            "ndk;27.2.12479018"

      - name: Configure Android toolchain
        shell: bash
        run: |
          set -eux

          SDK="$ANDROID_SDK_ROOT"
          NDK="$SDK/ndk/27.2.12479018"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

          echo "$TOOLCHAIN" >> "$GITHUB_PATH"

          echo "CC=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX=$TOOLCHAIN/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$TOOLCHAIN/llvm-ranlib" >> "$GITHUB_ENV"

      - name: Verify repository layout
        shell: bash
        run: |
          set -eux

          test -f core/Makefile
          test -f core/permute.cpp
          test -f core/simd_definitions.cpp
          test -f core/simd_definitions.hpp
          test -f core/engine.cpp

          echo "Repository layout OK"

      - name: Patch Android incompatible -m64 flags
        shell: bash
        run: |
          set -eux

          cd core

          cp Makefile Makefile.original

          # Android AArch64 clang does not need -m64.
          # The original Makefile explicitly adds it to several commands.
          sed -i \
            -e 's/ -m64//g' \
            -e 's/-m64 //g' \
            Makefile

          echo "Patched Makefile:"
          grep -n -- "-m64" Makefile || true

      # ------------------------------------------------------------
      # IMPORTANT:
      #
      # permute is a BUILD-TIME utility.
      #
      # It does NOT need to be Android ARM64.
      #
      # The previous workflow built Android permute and then tried
      # to execute it with QEMU. Because Android binaries expect
      # /system/bin/linker64, QEMU failed.
      #
      # Instead, compile permute natively for the Ubuntu runner.
      # ------------------------------------------------------------

      - name: Build HOST permuter
        shell: bash
        run: |
          set -eux

          cd core

          rm -f permute

          clang++ \
            -std=gnu++17 \
            -O3 \
            -march=native \
            -flto \
            -funroll-loops \
            -D_CRT_SECURE_NO_WARNINGS \
            -I. \
            permute.cpp \
            -o permute

          file permute

          ./permute --help || true

      - name: Download Prune network
        shell: bash
        run: |
          set -eux

          cd core

          NETNAME="$(tail -1 nn-name.txt)"

          echo "NETNAME=$NETNAME"

          if [ ! -f "${NETNAME}.bin" ]; then
            make download NETNAME="$NETNAME"
          fi

          test -f "${NETNAME}.bin"

          echo "Network:"
          ls -lh "${NETNAME}.bin"

      - name: Generate model.bin with HOST permuter
        shell: bash
        run: |
          set -eux

          cd core

          NETNAME="$(tail -1 nn-name.txt)"

          rm -f model.bin

          echo "Input network:"
          ls -lh "${NETNAME}.bin"

          echo
          echo "Running HOST x86_64 permuter..."
          echo

          timeout 180 ./permute \
            "${NETNAME}.bin" \
            model.bin

          test -f model.bin
          test -s model.bin

          echo
          echo "Generated model.bin:"
          ls -lh model.bin

          file model.bin

      - name: Verify Android compiler
        shell: bash
        run: |
          set -eux

          "$CXX" --version

          echo
          echo "Target:"
          "$CXX" \
            -target aarch64-unknown-linux-android24 \
            -### \
            -x c++ \
            /dev/null \
            2>&1 | head -40

      - name: Test ARM64 NEON compilation
        shell: bash
        run: |
          set -eux

          cd core

          cat > simd_android_test.cpp <<'EOF'
          #include <arm_neon.h>

          int main() {
              uint8x16_t a = vdupq_n_u8(1);
              uint8x16_t b = vdupq_n_u8(2);
              uint8x16_t c = vaddq_u8(a, b);

              return vgetq_lane_u8(vget_low_u8(c), 0) == 3 ? 0 : 1;
          }
          EOF

          "$CXX" \
            -std=gnu++17 \
            -O2 \
            -march=armv8-a+simd \
            -D__ARM_NEON__ \
            -flax-vector-conversions \
            simd_android_test.cpp \
            -o simd_android_test

          file simd_android_test

          "$CXX" \
            -dumpmachine

          rm -f simd_android_test.cpp simd_android_test

      - name: Test Prune SIMD source
        shell: bash
        run: |
          set -eux

          cd core

          cat > simd_source_test.cpp <<'EOF'
          #include "simd_definitions.hpp"

          int main() {
              return 0;
          }
          EOF

          "$CXX" \
            -std=gnu++17 \
            -O2 \
            -march=armv8.2-a+dotprod \
            -D__ARM_NEON__ \
            -flax-vector-conversions \
            -I. \
            -c simd_source_test.cpp \
            -o simd_source_test.o

          rm -f simd_source_test.cpp simd_source_test.o

          echo "Prune SIMD header compiles for ARM64."

      - name: Clean previous objects
        shell: bash
        run: |
          set -eux

          cd core

          make clean || true

          # These are generated build-time files.
          # Keep the network and generated model.
          test -f model.bin
          test -s model.bin

      - name: Build Prune Android ARM64 NEON DotProd
        shell: bash
        run: |
          set -eux

          cd core

          export CC="$CC"
          export CXX="$CXX"
          export AR="$AR"
          export RANLIB="$RANLIB"

          ARCH="armv8.2-a+dotprod"

          echo "Building:"
          echo "  ARCH=$ARCH"
          echo "  CPUSET=unknow"
          echo "  CC=$CC"
          echo "  CXX=$CXX"

          # IMPORTANT:
          #
          # Do NOT use make -B here.
          #
          # model.bin was already generated by the HOST permuter.
          # -B could force Make to rebuild the model/permute chain.
          #
          # A normal make after make clean will compile all Android
          # objects while preserving the already-generated model.bin.

          make prune \
            CC="$CC" \
            CXX="$CXX" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            ARCH="$ARCH" \
            CPUSET=unknow \
            ADDOPTION="-D__ARM_NEON__ -flax-vector-conversions" \
            OPT="-O3 -flto -funroll-loops"

      - name: Find produced binary
        shell: bash
        run: |
          set -eux

          cd core

          echo "Core directory:"
          ls -lah

          echo
          echo "Candidate binaries:"
          find . -maxdepth 1 -type f -perm -111 -print

          # The Makefile normally produces the Prune binary as "prune".
          test -f prune
          test -x prune

      - name: Verify Android ARM64 ELF
        shell: bash
        run: |
          set -eux

          cd core

          file prune

          readelf -h prune | tee /tmp/elf.txt

          grep -q "AArch64" /tmp/elf.txt

          echo
          echo "Machine:"
          readelf -h prune | grep -E "Class:|Machine:|Type:"

          echo
          echo "Dynamic dependencies:"
          readelf -d prune 2>/dev/null | grep NEEDED || true

      - name: Inspect ARM instructions
        shell: bash
        run: |
          set -eux

          cd core

          echo "Checking architecture:"
          objdump -d prune 2>/dev/null | head -100 || true

          echo
          echo "Searching for ARM NEON instructions:"
          objdump -d prune 2>/dev/null \
            | grep -E \
              "fmla|fadd|fmul|addv|ld1|st1|dup|cnt|tbl|zip|uzp|ext" \
            | head -30 || true

      - name: Check model embedding
        shell: bash
        run: |
          set -eux

          cd core

          echo "model.bin:"
          ls -lh model.bin

          echo
          echo "prune:"
          ls -lh prune

          echo
          echo "Binary strings related to NNUE/network:"
          strings prune | grep -Ei \
            "pulsar|nnue|network|model" \
            | head -30 || true

      - name: Prepare artifact
        shell: bash
        run: |
          set -eux

          mkdir -p artifact

          cp core/prune \
            artifact/prune-android-arm64-neon-dotprod

          chmod +x \
            artifact/prune-android-arm64-neon-dotprod

          cp core/model.bin \
            artifact/model.bin

          tar -czf \
            prune-android-arm64-neon-dotprod.tar.gz \
            -C artifact \
            .

          ls -lh \
            prune-android-arm64-neon-dotprod.tar.gz \
            artifact/*

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: prune-android-arm64-neon-dotprod
          path: |
            prune-android-arm64-neon-dotprod.tar.gz
            artifact/prune-android-arm64-neon-dotprod
            artifact/model.bin
          if-no-files-found: error
