name: Prune Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "core/**"
      - "Fathom/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    name: Android ARM64 NEON
    runs-on: ubuntu-24.04

    env:
      ANDROID_API: "24"
      NDK_VERSION: "27.2.12479018"

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Install host tools
      # ============================================================
      - name: Install host tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            make \
            curl \
            file \
            binutils-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            qemu-user-static

      # ============================================================
      # 3. Locate GitHub's preinstalled Android SDK
      #
      # IMPORTANT:
      #
      # We deliberately do NOT use:
      #
      #   android-actions/setup-android
      #
      # because the current v3 action can request the obsolete
      # "tools" package.
      # ============================================================
      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          else
            echo "ERROR: Android SDK was not found."
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "Android SDK:"
          echo "$SDK"

          echo
          echo "SDK contents:"
          ls -lah "$SDK"

      # ============================================================
      # 4. Locate sdkmanager
      # ============================================================
      - name: Locate sdkmanager
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null \
            | sort \
            | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$SDK" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version

      # ============================================================
      # 5. Accept licenses
      # ============================================================
      - name: Accept Android licenses
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "Android SDK licenses accepted."

      # ============================================================
      # 6. Install Android platform + NDK
      #
      # No "tools" package.
      # No build-tools requirement.
      # ============================================================
      - name: Install Android NDK
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${NDK_VERSION}"

      # ============================================================
      # 7. Verify NDK
      # ============================================================
      - name: Verify NDK
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

          if [ ! -d "$NDK" ]; then
            echo "ERROR: NDK was not installed:"
            echo "$NDK"
            exit 1
          fi

          echo "NDK:"
          echo "$NDK"

          ls -lah "$NDK"

      # ============================================================
      # 8. Configure Android compiler
      # ============================================================
      - name: Configure Android toolchain
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CC="$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang"
          CXX="$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang++"
          AR="$TOOLCHAIN/llvm-ar"
          STRIP="$TOOLCHAIN/llvm-strip"

          test -x "$CC"
          test -x "$CXX"

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "ANDROID_CC=$CC" >> "$GITHUB_ENV"
          echo "ANDROID_CXX=$CXX" >> "$GITHUB_ENV"
          echo "ANDROID_AR=$AR" >> "$GITHUB_ENV"
          echo "ANDROID_STRIP=$STRIP" >> "$GITHUB_ENV"

          echo "CC=$CC"
          echo "CXX=$CXX"

      # ============================================================
      # 9. Verify compiler
      # ============================================================
      - name: Verify compiler
        run: |
          set -e

          "$ANDROID_CXX" --version

          echo
          echo "Target:"
          "$ANDROID_CXX" -dumpmachine

          echo
          echo "Compiler target must contain aarch64-linux-android."

          "$ANDROID_CXX" -dumpmachine \
            | grep -q "aarch64-linux-android"

      # ============================================================
      # 10. Download Prune NNUE
      # ============================================================
      - name: Download NNUE
        working-directory: core
        shell: bash
        run: |
          set -e

          RELEASE=$(head -n 1 nn-name.txt)
          NETNAME=$(tail -n 1 nn-name.txt)

          echo "Release: $RELEASE"
          echo "Network: $NETNAME"

          curl -fL \
            -o "${NETNAME}.bin" \
            "https://github.com/tgirolami09/Prune-nets/releases/download/${RELEASE}/${NETNAME}.bin"

          test -s "${NETNAME}.bin"

          echo
          echo "Network:"
          ls -lh "${NETNAME}.bin"

          echo
          sha256sum "${NETNAME}.bin"

      # ============================================================
      # 11. Build ARM64 Linux permute
      # ============================================================
      - name: Build ARM64 permute
        working-directory: core
        shell: bash
        run: |
          set -e

          rm -f permute-arm64

          aarch64-linux-gnu-g++ \
            -O3 \
            -std=gnu++17 \
            -static \
            -o permute-arm64 \
            permute.cpp

          chmod +x permute-arm64

          echo "permute-arm64:"
          file permute-arm64

          echo
          readelf -h permute-arm64 \
            | grep -E "Class:|Machine:|Type:"

      # ============================================================
      # 12. Generate ARM NEON model
      # ============================================================
      - name: Generate ARM NEON model
        working-directory: core
        shell: bash
        run: |
          set -e

          NETNAME=$(tail -n 1 nn-name.txt)

          rm -f model.bin

          echo "Running ARM64 permute through QEMU..."

          qemu-aarch64-static \
            ./permute-arm64 \
            "${NETNAME}.bin" \
            model.bin

          test -s model.bin

          echo
          echo "Generated model:"
          ls -lh model.bin

          echo
          sha256sum model.bin

      # ============================================================
      # 13. Verify ARM code exists
      # ============================================================
      - name: Verify ARM NEON permutation
        working-directory: core
        shell: bash
        run: |
          set -e

          grep -q "__ARM_NEON__" permute.cpp

          echo "ARM NEON path found in permute.cpp."

      # ============================================================
      # 14. Remove x86-only Makefile option
      # ============================================================
      - name: Prepare Makefile
        working-directory: core
        shell: bash
        run: |
          set -e

          cp Makefile Makefile.android.original

          sed -i 's/ -m64//g' Makefile

          echo "Checking Makefile for -m64:"
          grep -n -- "-m64" Makefile || true

      # ============================================================
      # 15. Clean
      # ============================================================
      - name: Clean build
        working-directory: core
        shell: bash
        run: |
          make clean || true

          find . -type f \
            \( -name "*.o" -o -name "*.a" \) \
            -delete

          rm -f prune
          rm -f prune-android-arm64-neon

          test -s model.bin

      # ============================================================
      # 16. Compile Android ARM64 NEON
      # ============================================================
      - name: Compile Prune
        working-directory: core
        shell: bash
        run: |
          set -e

          export CC="$ANDROID_CC"
          export CXX="$ANDROID_CXX"

          CFLAGS="-O3 -flto -funroll-loops -march=armv8.2-a+dotprod -fPIC"

          CXXFLAGS="-O3 -flto -funroll-loops -march=armv8.2-a+dotprod -fPIC"

          LDFLAGS="-flto -march=armv8.2-a+dotprod -static-libstdc++"

          echo "CC:"
          echo "$CC"

          echo
          echo "CXX:"
          echo "$CXX"

          echo
          echo "CFLAGS:"
          echo "$CFLAGS"

          echo
          echo "CXXFLAGS:"
          echo "$CXXFLAGS"

          echo
          echo "Starting Prune build..."

          make -B prune \
            CC="$CC" \
            CXX="$CXX" \
            CFLAGS="$CFLAGS" \
            CXXFLAGS="$CXXFLAGS" \
            LDFLAGS="$LDFLAGS"

      # ============================================================
      # 17. Locate resulting binary
      # ============================================================
      - name: Locate binary
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Files:"
          ls -lah

          PRUNE=$(find . -maxdepth 1 \
            -type f \
            -name "prune*" \
            ! -name "*.o" \
            ! -name "*.d" \
            ! -name "*.bin" \
            ! -name "permute*" \
            | head -n 1)

          if [ -z "$PRUNE" ]; then
            echo "ERROR: No Prune executable found."
            exit 1
          fi

          cp "$PRUNE" prune-android-arm64-neon

          chmod +x prune-android-arm64-neon

      # ============================================================
      # 18. Verify AArch64
      # ============================================================
      - name: Verify AArch64 binary
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Binary:"
          file prune-android-arm64-neon

          echo
          echo "ELF header:"

          readelf -h prune-android-arm64-neon \
            | grep -E \
              "Class:|Data:|Type:|Machine:"

          MACHINE=$(readelf -h prune-android-arm64-neon \
            | awk -F: '/Machine:/ {print $2}')

          echo
          echo "Machine = $MACHINE"

          echo "$MACHINE" | grep -qi "AArch64"

      # ============================================================
      # 19. Inspect dependencies
      # ============================================================
      - name: Inspect dependencies
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "NEEDED libraries:"

          readelf -d prune-android-arm64-neon \
            | grep NEEDED \
            || true

          echo
          echo "Architecture attributes:"

          readelf -A prune-android-arm64-neon \
            || true

      # ============================================================
      # 20. Inspect ARM SIMD
      # ============================================================
      - name: Inspect ARM SIMD
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "ARM SIMD instructions found:"

          aarch64-linux-gnu-objdump \
            -d prune-android-arm64-neon \
            | grep -E \
              "sdot|udot|addv|ld1|st1|smull|smlal|umull|umlal" \
            | head -40 \
            || true

      # ============================================================
      # 21. Final validation
      # ============================================================
      - name: Final validation
        working-directory: core
        shell: bash
        run: |
          set -e

          test -x prune-android-arm64-neon
          test -s model.bin

          echo
          echo "=============================================="
          echo " PRUNE ANDROID ARM64 NEON"
          echo "=============================================="

          echo
          echo "Binary:"
          ls -lh prune-android-arm64-neon

          echo
          echo "Model:"
          ls -lh model.bin

          echo
          echo "SHA256:"
          sha256sum \
            prune-android-arm64-neon \
            model.bin

          echo
          echo "ELF:"
          file prune-android-arm64-neon

      # ============================================================
      # 22. Package
      # ============================================================
      - name: Package artifact
        shell: bash
        run: |
          set -e

          mkdir -p android-artifact

          cp core/prune-android-arm64-neon \
            android-artifact/

          cp core/model.bin \
            android-artifact/

          cp core/nn-name.txt \
            android-artifact/

          sha256sum \
            android-artifact/prune-android-arm64-neon \
            android-artifact/model.bin \
            > android-artifact/SHA256SUMS.txt

          ls -lah android-artifact

      # ============================================================
      # 23. Upload
      # ============================================================
      - name: Upload Android ARM64 NEON
        uses: actions/upload-artifact@v4
        with:
          name: prune-android-arm64-neon
          path: android-artifact/
          if-no-files-found: error
