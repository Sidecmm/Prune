name: Prune Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "core/**"
      - "Fathom/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    name: Android ARM64 NEON
    runs-on: ubuntu-24.04

    env:
      ANDROID_API: "24"
      NDK_VERSION: "27.2.12479018"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # HOST TOOLS
      # ============================================================

      - name: Install host tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            make \
            curl \
            file \
            perl \
            binutils-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            qemu-user-static

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          else
            echo "ERROR: Android SDK was not found."
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "Android SDK:"
          echo "$SDK"

      - name: Locate sdkmanager
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null \
            | sort \
            | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version

      - name: Accept Android licenses
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "Android licenses accepted."

      - name: Install Android NDK
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${NDK_VERSION}"

      - name: Verify NDK
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

          test -d "$NDK"

          echo "NDK:"
          echo "$NDK"

      # ============================================================
      # ANDROID TOOLCHAIN
      # ============================================================

      - name: Configure Android toolchain
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CC="$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang"
          CXX="$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang++"
          AR="$TOOLCHAIN/llvm-ar"
          STRIP="$TOOLCHAIN/llvm-strip"

          test -x "$CC"
          test -x "$CXX"

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "ANDROID_CC=$CC" >> "$GITHUB_ENV"
          echo "ANDROID_CXX=$CXX" >> "$GITHUB_ENV"
          echo "ANDROID_AR=$AR" >> "$GITHUB_ENV"
          echo "ANDROID_STRIP=$STRIP" >> "$GITHUB_ENV"

          echo "CC=$CC"
          echo "CXX=$CXX"

      - name: Verify Android ARM64 compiler
        shell: bash
        run: |
          set -e

          echo "Android compiler:"
          "$ANDROID_CXX" --version

          echo
          echo "Target:"

          TARGET=$("$ANDROID_CXX" -dumpmachine)

          echo "$TARGET"

          echo "$TARGET" | grep -Eq '^aarch64-(unknown-)?linux-android'

          echo
          echo "PASS: Android ARM64 compiler detected."

      # ============================================================
      # NNUE DOWNLOAD
      # ============================================================

      - name: Download Prune NNUE
        working-directory: core
        shell: bash
        run: |
          set -e

          RELEASE=$(head -n 1 nn-name.txt)
          NETNAME=$(tail -n 1 nn-name.txt)

          echo "Release:"
          echo "$RELEASE"

          echo
          echo "Network:"
          echo "$NETNAME"

          curl -fL \
            -o "${NETNAME}.bin" \
            "https://github.com/tgirolami09/Prune-nets/releases/download/${RELEASE}/${NETNAME}.bin"

          test -s "${NETNAME}.bin"

          echo
          echo "Downloaded NNUE:"
          ls -lh "${NETNAME}.bin"

          echo
          echo "SHA256:"
          sha256sum "${NETNAME}.bin"

      # ============================================================
      # HOST AARCH64 TOOLCHAIN
      # ============================================================

      - name: Verify ARM64 host compiler
        shell: bash
        run: |
          set -e

          echo "AArch64 compiler:"
          aarch64-linux-gnu-g++ --version

          echo
          echo "Target:"
          aarch64-linux-gnu-g++ -dumpmachine

      - name: Verify ARM NEON macros
        shell: bash
        run: |
          set -e

          echo "Checking ARM NEON predefined macros..."

          aarch64-linux-gnu-g++ \
            -march=armv8-a+simd \
            -dM \
            -E \
            -x c++ \
            /dev/null \
            | grep -E \
              '__aarch64__|__ARM_NEON|__ARM_NEON_FP'

          echo
          echo "PASS: ARM NEON macros are available."

      # ============================================================
      # SIMD INSPECTION
      # ============================================================

      - name: Inspect Prune SIMD definitions
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Relevant SIMD definitions:"

          grep -n \
            -E \
            "__ARM_NEON__|__aarch64__|SSE2|_simd|using simd" \
            simd_definitions.hpp \
            | head -100 \
            || true

      # ============================================================
      # ARM64 NNUE PERMUTE
      #
      # IMPORTANT:
      # The permutation utility is compiled for AArch64 and executed
      # through QEMU. This means architecture-dependent permutation
      # code executes as ARM NEON rather than x86_64.
      # ============================================================

      - name: Build ARM64 NEON permute
        working-directory: core
        shell: bash
        run: |
          set -e

          rm -f permute-arm64

          echo "Building ARM64 NEON permute utility..."

          aarch64-linux-gnu-g++ \
            -O3 \
            -std=gnu++17 \
            -march=armv8-a+simd \
            -D__ARM_NEON__ \
            -flax-vector-conversions \
            -static \
            -o permute-arm64 \
            permute.cpp

          chmod +x permute-arm64

          echo
          echo "permute-arm64:"
          file permute-arm64

          echo
          echo "ELF header:"

          readelf -h permute-arm64 \
            | grep -E \
              "Class:|Machine:|Type:"

      - name: Generate ARM NEON model.bin
        working-directory: core
        shell: bash
        run: |
          set -e

          NETNAME=$(tail -n 1 nn-name.txt)

          rm -f model.bin

          echo "Running ARM64 permute through QEMU..."

          qemu-aarch64-static \
            ./permute-arm64 \
            "${NETNAME}.bin" \
            model.bin

          test -s model.bin

          echo
          echo "Generated ARM model.bin:"
          ls -lh model.bin

          echo
          echo "SHA256:"
          sha256sum model.bin

      # ============================================================
      # MAKEFILE BACKUP
      # ============================================================

      - name: Backup Makefile
        working-directory: core
        shell: bash
        run: |
          set -e

          cp Makefile Makefile.android.original

          echo "Original Makefile backed up."

      # ============================================================
      # REMOVE DIRECT X86 FLAGS
      # ============================================================

      - name: Remove direct x86 architecture flags
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "DIRECT MAKEFILE ARCH FLAGS"
          echo "========================================"

          grep -n \
            -E \
            -- "-m64|-march=native" \
            Makefile \
            || true

          echo
          echo "Removing direct x86-specific flags..."

          perl -0pi -e \
            's/(^|[[:space:]])-m64(?=[[:space:]]|$)/$1/g' \
            Makefile

          perl -0pi -e \
            's/(^|[[:space:]])-march=native(?=[[:space:]]|$)/$1/g' \
            Makefile

          echo
          echo "Remaining direct -m64:"

          if grep -n -- "-m64" Makefile; then
            echo "ERROR: -m64 still exists directly in Makefile."
            exit 1
          else
            echo "NONE"
          fi

          echo
          echo "Remaining direct -march=native:"

          if grep -n -- "-march=native" Makefile; then
            echo "ERROR: -march=native still exists directly in Makefile."
            exit 1
          else
            echo "NONE"
          fi

      # ============================================================
      # FIND EVERY REMAINING -march=native
      #
      # We deliberately search the entire source tree because the
      # previous Makefile-only check proved that the flag is being
      # injected elsewhere.
      # ============================================================

      - name: Find remaining native architecture flags
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING ENTIRE CORE TREE"
          echo "========================================"

          echo

          grep -RIn \
            --exclude-dir=.git \
            --exclude='*.o' \
            --exclude='*.d' \
            --exclude='*.bin' \
            -- '-march=native' \
            . \
            || true

          echo
          echo "========================================"
          echo "SEARCHING ALL ARCHITECTURE FLAGS"
          echo "========================================"

          grep -RIn \
            --exclude-dir=.git \
            --exclude='*.o' \
            --exclude='*.d' \
            --exclude='*.bin' \
            -E \
            -- '-march=|-mcpu=|-m64' \
            . \
            | head -300 \
            || true

      # ============================================================
      # MAKE DATABASE DIAGNOSTICS
      #
      # This is the key part.
      #
      # We inspect GNU make's expanded database rather than assuming
      # the flag lives in Makefile.
      # ============================================================

      - name: Inspect GNU Make variables and rules
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GNU MAKE VARIABLE DATABASE"
          echo "========================================"

          make -pn \
            CC="$ANDROID_CC" \
            CXX="$ANDROID_CXX" \
            2>/dev/null \
            > make.database.txt

          echo
          echo "Architecture-related variables:"

          grep -n \
            -E \
            '(^|[[:space:]])(ARCH|ARCHFLAGS|CPUFLAGS|CFLAGS|CXXFLAGS|CPPFLAGS|LDFLAGS|TARGET_FLAGS)[[:space:]]*[:?+]?=' \
            make.database.txt \
            | head -200 \
            || true

          echo
          echo "Every occurrence of -march=native in make database:"

          grep -n \
            -- '-march=native' \
            make.database.txt \
            | head -200 \
            || true

          echo
          echo "BestMoveFinder rule from make database:"

          grep -n \
            -B8 \
            -A12 \
            'BestMoveFinder.o:' \
            make.database.txt \
            | head -100 \
            || true

          echo
          echo "========================================"
          echo "MAKE DATABASE CREATED"
          echo "========================================"

          ls -lh make.database.txt

      # ============================================================
      # CLEAN BUILD
      # ============================================================

      - name: Clean build
        working-directory: core
        shell: bash
        run: |
          set -e

          make clean || true

          find . -type f \
            \( -name "*.o" -o -name "*.a" \) \
            -delete

          rm -f prune
          rm -f prune-android-arm64-neon

          test -s model.bin

      # ============================================================
      # BUILD
      #
      # We explicitly override the common make variables.
      #
      # The extra MAKEFLAGS filter is defensive: if an included
      # makefile appends -march=native to these variables, the final
      # compiler invocation is checked below.
      # ============================================================

      - name: Compile Prune Android ARM64 NEON
        working-directory: core
        shell: bash
        run: |
          set -e

          export CC="$ANDROID_CC"
          export CXX="$ANDROID_CXX"

          CFLAGS="-O3 -flto -funroll-loops -march=armv8.2-a+dotprod -fPIC"

          CXXFLAGS="-O3 -flto -funroll-loops -march=armv8.2-a+dotprod -fPIC"

          CPPFLAGS=""

          LDFLAGS="-flto -march=armv8.2-a+dotprod -static-libstdc++"

          # Explicitly empty common architecture variables.
          ARCH=""
          ARCHFLAGS=""
          CPUFLAGS=""
          TARGET_FLAGS=""

          export CFLAGS
          export CXXFLAGS
          export CPPFLAGS
          export LDFLAGS
          export ARCH
          export ARCHFLAGS
          export CPUFLAGS
          export TARGET_FLAGS

          echo "CC:"
          echo "$CC"

          echo
          echo "CXX:"
          echo "$CXX"

          echo
          echo "CFLAGS:"
          echo "$CFLAGS"

          echo
          echo "CXXFLAGS:"
          echo "$CXXFLAGS"

          echo
          echo "LDFLAGS:"
          echo "$LDFLAGS"

          echo
          echo "ARCH:"
          echo "$ARCH"

          echo
          echo "ARCHFLAGS:"
          echo "$ARCHFLAGS"

          echo
          echo "CPUFLAGS:"
          echo "$CPUFLAGS"

          echo
          echo "TARGET_FLAGS:"
          echo "$TARGET_FLAGS"

          echo
          echo "========================================"
          echo "FINAL SOURCE CHECK"
          echo "========================================"

          if grep -RIn \
            --exclude-dir=.git \
            --exclude='*.o' \
            --exclude='*.d' \
            --exclude='*.bin' \
            -- '-march=native' \
            .; then

            echo
            echo "WARNING:"
            echo "-march=native still exists somewhere in source."

          else

            echo "No -march=native found in source."

          fi

          echo
          echo "========================================"
          echo "STARTING PRUNE COMPILATION"
          echo "========================================"

          make -B prune \
            CC="$CC" \
            CXX="$CXX" \
            CFLAGS="$CFLAGS" \
            CXXFLAGS="$CXXFLAGS" \
            CPPFLAGS="$CPPFLAGS" \
            LDFLAGS="$LDFLAGS" \
            ARCH="$ARCH" \
            ARCHFLAGS="$ARCHFLAGS" \
            CPUFLAGS="$CPUFLAGS" \
            TARGET_FLAGS="$TARGET_FLAGS"

      # ============================================================
      # LOCATE BINARY
      # ============================================================

      - name: Locate Prune binary
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Core directory:"
          ls -lah

          PRUNE=$(find . -maxdepth 1 \
            -type f \
            -name "prune*" \
            ! -name "*.o" \
            ! -name "*.d" \
            ! -name "*.bin" \
            ! -name "permute*" \
            | head -n 1)

          if [ -z "$PRUNE" ]; then
            echo "ERROR: Prune executable was not found."
            exit 1
          fi

          echo
          echo "Found:"
          echo "$PRUNE"

          cp "$PRUNE" prune-android-arm64-neon

          chmod +x prune-android-arm64-neon

      # ============================================================
      # ELF VALIDATION
      # ============================================================

      - name: Verify AArch64 ELF
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Binary:"
          file prune-android-arm64-neon

          echo
          echo "ELF header:"

          readelf -h prune-android-arm64-neon \
            | grep -E \
              "Class:|Data:|Type:|Machine:"

          MACHINE=$(readelf -h prune-android-arm64-neon \
            | awk -F: '/Machine:/ {print $2}')

          echo
          echo "Machine:"
          echo "$MACHINE"

          echo "$MACHINE" | grep -qi "AArch64"

          echo
          echo "PASS: binary is AArch64."

      # ============================================================
      # DEPENDENCY VALIDATION
      # ============================================================

      - name: Inspect binary dependencies
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Dynamic dependencies:"

          readelf -d prune-android-arm64-neon \
            | grep NEEDED \
            || true

          echo
          echo "Architecture attributes:"

          readelf -A prune-android-arm64-neon \
            || true

      # ============================================================
      # NEON / DOTPROD INSPECTION
      # ============================================================

      - name: Inspect ARM SIMD instructions
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Searching for ARM SIMD instructions..."

          aarch64-linux-gnu-objdump \
            -d \
            prune-android-arm64-neon \
            | grep -E \
              "sdot|udot|addv|ld1|st1|smull|smlal|umull|umlal" \
            | head -100 \
            || true

      # ============================================================
      # FINAL VALIDATION
      # ============================================================

      - name: Final validation
        working-directory: core
        shell: bash
        run: |
          set -e

          test -x prune-android-arm64-neon
          test -s model.bin

          echo
          echo "=============================================="
          echo " PRUNE ANDROID ARM64 NEON BUILD SUCCESS"
          echo "=============================================="

          echo
          echo "Binary:"
          ls -lh prune-android-arm64-neon

          echo
          echo "Model:"
          ls -lh model.bin

          echo
          echo "SHA256:"

          sha256sum \
            prune-android-arm64-neon \
            model.bin

          echo
          echo "File:"

          file prune-android-arm64-neon

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package Android build
        shell: bash
        run: |
          set -e

          mkdir -p android-artifact

          cp core/prune-android-arm64-neon \
            android-artifact/

          cp core/model.bin \
            android-artifact/

          cp core/nn-name.txt \
            android-artifact/

          cp core/make.database.txt \
            android-artifact/

          cp core/Makefile.android.original \
            android-artifact/

          sha256sum \
            android-artifact/prune-android-arm64-neon \
            android-artifact/model.bin \
            > android-artifact/SHA256SUMS.txt

          echo
          echo "Artifact contents:"

          ls -lah android-artifact

      - name: Upload Android ARM64 NEON
        uses: actions/upload-artifact@v4
        with:
          name: prune-android-arm64-neon
          path: android-artifact/
          if-no-files-found: error
