name: Prune Android ARM64 NEON

on:
  workflow_dispatch:

jobs:
  build:
    name: Diagnose Prune ARM64 SIMD
    runs-on: ubuntu-24.04

    env:
      ANDROID_API: "24"
      NDK_VERSION: "27.2.12479018"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            make \
            curl \
            file \
            perl \
            binutils-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            qemu-user-static

      - name: Locate Android SDK
        run: |
          set -e

          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          else
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Locate sdkmanager
        run: |
          set -e

          SDK="$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null \
            | sort \
            | tail -n 1)

          test -n "$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          "$SDKMANAGER" --version

      - name: Install Android NDK
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${NDK_VERSION}"

      - name: Configure NDK
        run: |
          set -e

          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CC="$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang"
          CXX="$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang++"

          test -x "$CC"
          test -x "$CXX"

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "ANDROID_CC=$CC" >> "$GITHUB_ENV"
          echo "ANDROID_CXX=$CXX" >> "$GITHUB_ENV"

      # ============================================================
      # SHOW THE ACTUAL SIMD FILE
      # ============================================================

      - name: Inspect simd_definitions.hpp
        working-directory: core
        run: |
          set -e

          echo "========================================"
          echo "simd_definitions.hpp"
          echo "========================================"

          nl -ba simd_definitions.hpp | sed -n '1,180p'

      # ============================================================
      # FIND SIMD IMPLEMENTATIONS
      # ============================================================

      - name: Find SIMD implementation files
        working-directory: core
        run: |
          set -e

          echo "========================================"
          echo "SIMD FILES"
          echo "========================================"

          find . \
            -type f \
            \( \
              -name "*.h" \
              -o -name "*.hpp" \
              -o -name "*.cpp" \
            \) \
            -print \
            | sort

          echo
          echo "========================================"
          echo "SIMD DEFINITIONS"
          echo "========================================"

          grep -RIn \
            --exclude-dir=.git \
            -E \
            'template.*simd|struct simd|class simd|using simd|typedef.*simd|MM_set1_epi16|MM_set1_epi32' \
            . \
            || true

      # ============================================================
      # FIND ARCHITECTURE CONDITIONS
      # ============================================================

      - name: Inspect architecture selection
        working-directory: core
        run: |
          set -e

          echo "========================================"
          echo "ARCHITECTURE CONDITIONS"
          echo "========================================"

          grep -RIn \
            --exclude-dir=.git \
            -E \
            '__x86_64__|__i386__|__aarch64__|__arm__|__ARM_NEON|__ARM_NEON__|AVX|SSE|NEON|ARM' \
            --include='*.h' \
            --include='*.hpp' \
            --include='*.cpp' \
            . \
            | head -500 \
            || true

      # ============================================================
      # PREPROCESSOR TEST
      # ============================================================

      - name: Test ARM64 preprocessor
        working-directory: core
        run: |
          set -e

          echo "========================================"
          echo "ARM64 PREDEFINED MACROS"
          echo "========================================"

          "$ANDROID_CXX" \
            -march=armv8.2-a+dotprod \
            -dM \
            -E \
            -x c++ \
            /dev/null \
            | grep -E \
              '__aarch64__|__ARM_NEON|__ARM_FEATURE_DOTPROD|__ARM_FP'

      # ============================================================
      # PREPROCESS simd_definitions.hpp
      # ============================================================

      - name: Preprocess SIMD header
        working-directory: core
        run: |
          set -e

          echo "========================================"
          echo "PREPROCESSING simd_definitions.hpp"
          echo "========================================"

          cat > simd_test.cpp <<'EOF'
          #include "simd_definitions.hpp"

          int main() {
              return 0;
          }
          EOF

          "$ANDROID_CXX" \
            -O0 \
            -std=gnu++17 \
            -march=armv8.2-a+dotprod \
            -D__ARM_NEON__ \
            -I. \
            -E \
            simd_test.cpp \
            > simd_preprocessed.txt

          echo
          echo "Preprocessing succeeded."

          echo
          echo "Searching resulting SIMD definitions:"

          grep -n \
            -E \
            'template.*simd|struct simd|class simd|MM_set1_epi16|MM_set1_epi32|NEON|ARM' \
            simd_preprocessed.txt \
            | head -200 \
            || true

      # ============================================================
      # DIRECT COMPILE OF SIMD HEADER
      # ============================================================

      - name: Compile SIMD test
        working-directory: core
        run: |
          set -e

          echo "========================================"
          echo "COMPILING SIMD TEST"
          echo "========================================"

          "$ANDROID_CXX" \
            -O0 \
            -std=gnu++17 \
            -march=armv8.2-a+dotprod \
            -D__ARM_NEON__ \
            -I. \
            -c \
            simd_test.cpp \
            -o simd_test.o

          file simd_test.o

      # ============================================================
      # CHECK MAKE ARCH FLAGS
      # ============================================================

      - name: Inspect Makefile
        working-directory: core
        run: |
          set -e

          echo "========================================"
          echo "MAKEFILE"
          echo "========================================"

          grep -n \
            -E \
            'ARCH|march|mcpu|native|CXXFLAGS|CFLAGS' \
            Makefile \
            | head -300 \
            || true

      # ============================================================
      # STOP
      # ============================================================

      - name: Diagnostic summary
        run: |
          echo
          echo "=============================================="
          echo " SIMD DIAGNOSTIC COMPLETE"
          echo "=============================================="
          echo
          echo "The important output is:"
          echo
          echo "1. simd_definitions.hpp"
          echo "2. locations defining template simd"
          echo "3. locations defining MM_set1_epi16"
          echo "4. ARM64 preprocessor macros"
          echo "5. whether simd_test.cpp compiles"
          echo
          echo "No source modifications were made."
