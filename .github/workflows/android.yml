name: Prune Android ARM64 NEON

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # HOST DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            clang \
            lld \
            make \
            curl \
            file \
            binutils \
            unzip


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -eux

          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"

          test -d "$SDK"

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "Android SDK:"
          ls -la "$SDK"


      # ============================================================
      # SDKMANAGER
      # ============================================================

      - name: Locate sdkmanager
        shell: bash
        run: |
          set -eux

          SDK="$ANDROID_SDK_ROOT"

          SDKMANAGER="$(find "$SDK/cmdline-tools" "$SDK/tools" \
            -name sdkmanager \
            -type f \
            2>/dev/null | head -1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"


      # ============================================================
      # INSTALL NDK
      # ============================================================

      - name: Install Android platform and NDK
        shell: bash
        run: |
          set -eux

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-24" \
            "ndk;27.2.12479018"


      # ============================================================
      # ANDROID TOOLCHAIN
      # ============================================================

      - name: Configure Android toolchain
        shell: bash
        run: |
          set -eux

          SDK="$ANDROID_SDK_ROOT"
          NDK="$SDK/ndk/27.2.12479018"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -d "$NDK"
          test -x "$TOOLCHAIN/aarch64-linux-android24-clang++"
          test -x "$TOOLCHAIN/aarch64-linux-android24-clang"

          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

          echo "$TOOLCHAIN" >> "$GITHUB_PATH"

          echo "CC=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX=$TOOLCHAIN/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$TOOLCHAIN/llvm-ranlib" >> "$GITHUB_ENV"


      # ============================================================
      # VERIFY SOURCE
      # ============================================================

      - name: Verify Prune source tree
        shell: bash
        run: |
          set -eux

          test -d core
          test -d Fathom

          test -f core/Makefile
          test -f core/permute.cpp
          test -f core/simd_definitions.cpp
          test -f core/simd_definitions.hpp
          test -f core/engine.cpp
          test -f core/TranspositionTable.cpp

          test -f Fathom/src/tbprobe.c

          echo "Prune source tree OK."


      # ============================================================
      # PATCH -m64
      # ============================================================

      - name: Patch core Makefile for Android AArch64
        shell: bash
        run: |
          set -eux

          cd core

          cp Makefile Makefile.original

          sed -i \
            -e 's/ -m64//g' \
            -e 's/-m64 //g' \
            Makefile

          echo
          echo "Remaining -m64 references:"
          grep -n -- "-m64" Makefile || true


      # ============================================================
      # PATCH Android aligned_alloc
      #
      # Android libc++ does not expose std::aligned_alloc reliably
      # in this configuration.
      #
      # Use POSIX posix_memalign instead.
      # ============================================================

      - name: Patch Android aligned allocation
        shell: bash
        run: |
          set -eux

          cd core

          python3 <<'PY'
          from pathlib import Path

          path = Path("TranspositionTable.cpp")
          text = path.read_text()

          old = "table = (Cluster*)std::aligned_alloc(alignment, size);"

          new = """void* ptr = nullptr;

          if (posix_memalign(&ptr, alignment, size) != 0) {
              ptr = nullptr;
          }

          table = static_cast<Cluster*>(ptr);"""

          if old not in text:
              raise SystemExit(
                  "ERROR: expected std::aligned_alloc line was not found"
              )

          text = text.replace(old, new, 1)

          path.write_text(text)

          print("Patched TranspositionTable.cpp")
          PY

          echo
          echo "Allocation code:"
          grep -n -A10 -B5 \
            "posix_memalign" \
            TranspositionTable.cpp


      # ============================================================
      # HOST PERMUTER
      # ============================================================

      - name: Build HOST permuter
        shell: bash
        run: |
          set -eux

          cd core

          rm -f permute

          clang++ \
            -std=gnu++17 \
            -O3 \
            -march=native \
            -flto \
            -funroll-loops \
            -D_CRT_SECURE_NO_WARNINGS \
            -I. \
            permute.cpp \
            -o permute

          test -x permute

          echo
          echo "HOST permuter:"
          file permute

          readelf -h permute | grep -E \
            "Class:|Machine:|Type:"


      # ============================================================
      # DOWNLOAD NETWORK
      # ============================================================

      - name: Download Prune network
        shell: bash
        run: |
          set -eux

          cd core

          NETNAME="$(tail -1 nn-name.txt)"

          echo "NETNAME=$NETNAME"

          if [ ! -f "${NETNAME}.bin" ]; then
            make download NETNAME="$NETNAME"
          fi

          test -f "${NETNAME}.bin"
          test -s "${NETNAME}.bin"

          echo
          echo "Network:"
          ls -lh "${NETNAME}.bin"


      # ============================================================
      # GENERATE model.bin
      # ============================================================

      - name: Generate model.bin
        shell: bash
        run: |
          set -eux

          cd core

          NETNAME="$(tail -1 nn-name.txt)"

          rm -f model.bin

          echo "Input network:"
          ls -lh "${NETNAME}.bin"

          echo
          echo "Running HOST permuter..."

          timeout 180 \
            ./permute \
            "${NETNAME}.bin" \
            model.bin

          test -f model.bin
          test -s model.bin

          echo
          echo "Generated model.bin:"
          ls -lh model.bin


      # ============================================================
      # VERIFY ANDROID COMPILER
      # ============================================================

      - name: Verify Android compiler
        shell: bash
        run: |
          set -eux

          "$CC" --version
          "$CXX" --version

          echo
          echo "Target:"
          "$CXX" -dumpmachine

          TARGET="$("$CXX" -dumpmachine)"

          echo "$TARGET" | grep -Eq \
            '^aarch64-(unknown-)?linux-android'


      # ============================================================
      # BASIC ARM64 NEON TEST
      # ============================================================

      - name: Test ARM64 NEON compilation
        shell: bash
        run: |
          set -eux

          cd core

          cat > simd_android_test.cpp <<'EOF'
          #include <arm_neon.h>

          int main() {
              uint8x16_t a = vdupq_n_u8(1);
              uint8x16_t b = vdupq_n_u8(2);
              uint8x16_t c = vaddq_u8(a, b);

              return vget_lane_u8(vget_low_u8(c), 0) == 3 ? 0 : 1;
          }
          EOF

          "$CXX" \
            -std=gnu++17 \
            -O2 \
            -march=armv8-a+simd \
            -D__ARM_NEON__ \
            -flax-vector-conversions \
            simd_android_test.cpp \
            -o simd_android_test

          test -f simd_android_test

          file simd_android_test

          readelf -h simd_android_test | grep -E \
            "Class:|Machine:|Type:"

          rm -f \
            simd_android_test.cpp \
            simd_android_test


      # ============================================================
      # TEST PRUNE SIMD HEADER
      # ============================================================

      - name: Test Prune SIMD source
        shell: bash
        run: |
          set -eux

          cd core

          cat > simd_source_test.cpp <<'EOF'
          #include "simd_definitions.hpp"

          int main() {
              return 0;
          }
          EOF

          "$CXX" \
            -std=gnu++17 \
            -O2 \
            -march=armv8.2-a+dotprod \
            -D__ARM_NEON__ \
            -flax-vector-conversions \
            -I. \
            -c \
            simd_source_test.cpp \
            -o simd_source_test.o

          test -f simd_source_test.o

          echo "Prune SIMD header compiled successfully."

          rm -f \
            simd_source_test.cpp \
            simd_source_test.o


      # ============================================================
      # CLEAN OBJECTS
      # ============================================================

      - name: Clean previous object files
        shell: bash
        run: |
          set -eux

          cd core

          make clean || true

          test -f model.bin
          test -s model.bin

          echo "model.bin preserved:"
          ls -lh model.bin


      # ============================================================
      # BUILD PRUNE
      # ============================================================

      - name: Build Prune Android ARM64 NEON DotProd
        shell: bash
        run: |
          set -eux

          cd core

          ARCH="armv8.2-a+dotprod"

          echo "========================================"
          echo "PRUNE ANDROID BUILD"
          echo "========================================"
          echo "CC=$CC"
          echo "CXX=$CXX"
          echo "ARCH=$ARCH"
          echo "CPUSET=unknow"
          echo "========================================"

          make prune \
            CC="$CC" \
            CXX="$CXX" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            ARCH="$ARCH" \
            CPUSET=unknow \
            ADDOPTION="-D__ARM_NEON__ -flax-vector-conversions" \
            OPT="-O3 -flto -funroll-loops"


      # ============================================================
      # VERIFY BINARY
      # ============================================================

      - name: Verify Prune binary
        shell: bash
        run: |
          set -eux

          cd core

          test -f prune
          test -x prune

          echo
          echo "Prune:"
          ls -lh prune

          echo
          echo "File:"
          file prune


      # ============================================================
      # VERIFY ELF
      # ============================================================

      - name: Verify Android ARM64 ELF
        shell: bash
        run: |
          set -eux

          cd core

          readelf -h prune > /tmp/prune-elf.txt

          cat /tmp/prune-elf.txt

          grep -q "AArch64" /tmp/prune-elf.txt

          echo
          echo "ELF summary:"
          grep -E \
            "Class:|Data:|Type:|Machine:|Entry point:" \
            /tmp/prune-elf.txt


      # ============================================================
      # CHECK DEPENDENCIES
      # ============================================================

      - name: Inspect dynamic dependencies
        shell: bash
        run: |
          set -eux

          cd core

          echo "Dynamic dependencies:"
          readelf -d prune 2>/dev/null \
            | grep NEEDED || true

          echo
          echo "Interpreter:"
          readelf -l prune 2>/dev/null \
            | grep -A1 INTERP || true


      # ============================================================
      # INSPECT ARM CODE
      # ============================================================

      - name: Inspect ARM64 instructions
        shell: bash
        run: |
          set -eux

          cd core

          echo "ARM64 disassembly:"
          objdump -d prune 2>/dev/null \
            | head -150 || true

          echo
          echo "NEON/vector instruction sample:"
          objdump -d prune 2>/dev/null \
            | grep -E \
              "fmla|fmls|fmul|fadd|fsub|addv|ld1|ld2|ld3|ld4|st1|st2|st3|st4|dup|tbl|zip|uzp|ext" \
            | head -50 || true


      # ============================================================
      # VERIFY MODEL
      # ============================================================

      - name: Verify model embedding
        shell: bash
        run: |
          set -eux

          cd core

          test -f model.bin
          test -s model.bin

          test -f prune
          test -s prune

          echo
          echo "model.bin:"
          ls -lh model.bin

          echo
          echo "prune:"
          ls -lh prune

          echo
          echo "Network/model strings:"
          strings prune \
            | grep -Ei \
              "pulsar|nnue|network|model" \
            | head -50 || true


      # ============================================================
      # BUILD INFORMATION
      # ============================================================

      - name: Create build information
        shell: bash
        run: |
          set -eux

          mkdir -p artifact

          {
            echo "Prune Android ARM64 NEON DotProd"
            echo
            echo "Compiler:"
            "$CXX" --version | head -1
            echo
            echo "Target:"
            "$CXX" -dumpmachine
            echo
            echo "Architecture:"
            echo "armv8.2-a+dotprod"
            echo
            echo "Android API:"
            echo "24"
            echo
            echo "Network:"
            tail -1 core/nn-name.txt
            echo
            echo "Binary:"
            file core/prune
            echo
            echo "ELF:"
            readelf -h core/prune | grep -E \
              "Class:|Type:|Machine:"
            echo
            echo "Dynamic dependencies:"
            readelf -d core/prune 2>/dev/null \
              | grep NEEDED || true
          } > artifact/build-info.txt

          cat artifact/build-info.txt


      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package Android build
        shell: bash
        run: |
          set -eux

          cp \
            core/prune \
            artifact/prune-android-arm64-neon-dotprod

          chmod +x \
            artifact/prune-android-arm64-neon-dotprod

          cp \
            core/model.bin \
            artifact/model.bin

          tar -czf \
            prune-android-arm64-neon-dotprod.tar.gz \
            -C artifact \
            .

          echo
          echo "Artifacts:"
          ls -lh \
            artifact/* \
            prune-android-arm64-neon-dotprod.tar.gz


      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: prune-android-arm64-neon-dotprod
          path: |
            prune-android-arm64-neon-dotprod.tar.gz
            artifact/prune-android-arm64-neon-dotprod
            artifact/model.bin
            artifact/build-info.txt
          if-no-files-found: error
