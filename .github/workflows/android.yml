name: Prune Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "core/**"
      - "Fathom/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    name: Build Prune for Android ARM64 NEON
    runs-on: ubuntu-24.04

    env:
      NDK_VERSION: "27.2.12479018"
      ANDROID_API: "24"

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Host tools
      #
      # aarch64-linux-gnu-g++ is used to build Prune's permute
      # program as ARM64 Linux.
      #
      # QEMU then executes that ARM64 program on the x86 runner.
      # ============================================================
      - name: Install host tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            make \
            curl \
            file \
            binutils-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            qemu-user-static

      # ============================================================
      # 3. Android SDK / NDK
      #
      # setup-android already installs the command-line tools.
      #
      # DO NOT run:
      #
      #   sdkmanager tools
      #
      # "tools" is an obsolete package.
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 4. Install only what we actually need
      # ============================================================
      - name: Install Android NDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${NDK_VERSION}"

      # ============================================================
      # 5. Configure Android compiler
      # ============================================================
      - name: Configure Android toolchain
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

          if [ ! -d "$NDK" ]; then
            echo "ERROR: NDK not found:"
            echo "$NDK"
            exit 1
          fi

          echo "NDK:"
          echo "$NDK"

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

          echo "ANDROID_CC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang" >> "$GITHUB_ENV"

          echo "ANDROID_CXX=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang++" >> "$GITHUB_ENV"

          echo "ANDROID_AR=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"

          echo "ANDROID_STRIP=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" >> "$GITHUB_ENV"

      # ============================================================
      # 6. Verify toolchain
      # ============================================================
      - name: Verify Android compiler
        run: |
          set -e

          "$ANDROID_CXX" --version

          echo
          echo "Compiler:"
          echo "$ANDROID_CXX"

          test -x "$ANDROID_CXX"

      # ============================================================
      # 7. Download NNUE
      # ============================================================
      - name: Download NNUE
        working-directory: core
        shell: bash
        run: |
          set -e

          RELEASE=$(head -n 1 nn-name.txt)
          NETNAME=$(tail -n 1 nn-name.txt)

          echo "Release = $RELEASE"
          echo "Network = $NETNAME"

          curl -fL \
            -o "${NETNAME}.bin" \
            "https://github.com/tgirolami09/Prune-nets/releases/download/${RELEASE}/${NETNAME}.bin"

          test -s "${NETNAME}.bin"

          ls -lh "${NETNAME}.bin"

          echo
          echo "Network SHA256:"
          sha256sum "${NETNAME}.bin"

      # ============================================================
      # 8. Build ARM64 permute utility
      #
      # IMPORTANT:
      #
      # We compile permute.cpp for ARM64 Linux, NOT x86.
      #
      # This makes __ARM_NEON__ active in Prune's permutation code.
      # ============================================================
      - name: Build ARM64 NEON permute
        working-directory: core
        shell: bash
        run: |
          set -e

          rm -f permute-arm64

          echo "Compiling ARM64 permute..."

          aarch64-linux-gnu-g++ \
            -O3 \
            -std=gnu++17 \
            -static \
            -o permute-arm64 \
            permute.cpp

          chmod +x permute-arm64

          echo
          echo "permute:"
          file permute-arm64

          echo
          echo "ELF:"
          readelf -h permute-arm64 | grep -E \
            "Class:|Machine:|Type:"

      # ============================================================
      # 9. Generate ARM NEON model.bin
      #
      # QEMU executes the ARM64 permutation program.
      # ============================================================
      - name: Generate ARM NEON model
        working-directory: core
        shell: bash
        run: |
          set -e

          NETNAME=$(tail -n 1 nn-name.txt)

          rm -f model.bin

          echo "Generating ARM NEON model..."

          qemu-aarch64-static \
            ./permute-arm64 \
            "${NETNAME}.bin" \
            model.bin

          test -s model.bin

          echo
          echo "model.bin:"
          ls -lh model.bin

          echo
          echo "model SHA256:"
          sha256sum model.bin

      # ============================================================
      # 10. Verify ARM permutation path exists
      # ============================================================
      - name: Verify ARM NEON source
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Checking permute.cpp for ARM NEON..."

          grep -n "__ARM_NEON__" permute.cpp

          echo
          echo "ARM NEON sections:"
          grep -n -A12 -B5 "__ARM_NEON__" permute.cpp | head -80

      # ============================================================
      # 11. Remove x86-specific -m64 from original Makefile
      # ============================================================
      - name: Prepare Makefile
        working-directory: core
        shell: bash
        run: |
          set -e

          cp Makefile Makefile.android.original

          sed -i 's/ -m64//g' Makefile

          echo "Checking for remaining -m64:"
          grep -n -- "-m64" Makefile || true

      # ============================================================
      # 12. Clean old objects
      # ============================================================
      - name: Clean previous builds
        working-directory: core
        shell: bash
        run: |
          make clean || true

          find . -type f \
            \( -name "*.o" -o -name "*.a" \) \
            -delete

          rm -f prune
          rm -f prune-android-arm64-neon

          test -s model.bin

      # ============================================================
      # 13. Build Prune
      #
      # ARMv8.2-A + DotProd
      #
      # This is the target for modern ARM64 Android devices.
      # ============================================================
      - name: Compile Prune
        working-directory: core
        shell: bash
        run: |
          set -e

          export CC="$ANDROID_CC"
          export CXX="$ANDROID_CXX"

          export CFLAGS="-O3 -flto -funroll-loops -march=armv8.2-a+dotprod -fPIC"

          export CXXFLAGS="-O3 -flto -funroll-loops -march=armv8.2-a+dotprod -fPIC"

          export LDFLAGS="-flto -march=armv8.2-a+dotprod -static-libstdc++"

          echo "CC:"
          echo "$CC"

          echo
          echo "CXX:"
          echo "$CXX"

          echo
          echo "CXXFLAGS:"
          echo "$CXXFLAGS"

          echo
          echo "LDFLAGS:"
          echo "$LDFLAGS"

          echo
          echo "Starting Prune compilation..."

          make -B prune \
            CC="$ANDROID_CC" \
            CXX="$ANDROID_CXX" \
            CFLAGS="$CFLAGS" \
            CXXFLAGS="$CXXFLAGS" \
            LDFLAGS="$LDFLAGS"

      # ============================================================
      # 14. Locate executable
      # ============================================================
      - name: Locate executable
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Core directory:"
          ls -lah

          PRUNE=$(find . -maxdepth 1 \
            -type f \
            -name "prune*" \
            ! -name "*.o" \
            ! -name "*.d" \
            ! -name "*.bin" \
            ! -name "permute*" \
            | head -n 1)

          if [ -z "$PRUNE" ]; then
            echo "ERROR: Prune executable not found."
            exit 1
          fi

          cp "$PRUNE" prune-android-arm64-neon

          chmod +x prune-android-arm64-neon

          echo "PRUNE_BINARY=$PWD/prune-android-arm64-neon" >> "$GITHUB_ENV"

      # ============================================================
      # 15. Verify ELF
      # ============================================================
      - name: Verify ARM64 ELF
        working-directory: core
        shell: bash
        run: |
          set -e

          file prune-android-arm64-neon

          echo
          echo "ELF header:"

          readelf -h prune-android-arm64-neon \
            | grep -E \
              "Class:|Data:|Type:|Machine:"

          MACHINE=$(readelf -h prune-android-arm64-neon \
            | awk -F: '/Machine:/ {print $2}')

          echo
          echo "Detected machine:"
          echo "$MACHINE"

          echo "$MACHINE" | grep -qi "AArch64"

          echo
          echo "PASS: AArch64 executable."

      # ============================================================
      # 16. Inspect Android dependencies
      # ============================================================
      - name: Inspect dependencies
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Dynamic dependencies:"

          readelf -d prune-android-arm64-neon \
            | grep NEEDED \
            || true

          echo
          echo "Architecture attributes:"

          readelf -A prune-android-arm64-neon \
            || true

      # ============================================================
      # 17. Check ARM instructions
      # ============================================================
      - name: Inspect ARM SIMD instructions
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Searching for ARM SIMD / DotProd instructions..."

          aarch64-linux-gnu-objdump \
            -d prune-android-arm64-neon \
            | grep -E \
              "sdot|udot|addv|ld1|st1|smull|smlal|umull|umlal" \
            | head -40 \
            || true

      # ============================================================
      # 18. Final checks
      # ============================================================
      - name: Final validation
        working-directory: core
        shell: bash
        run: |
          set -e

          test -x prune-android-arm64-neon
          test -s model.bin

          echo
          echo "========================================"
          echo "PRUNE ANDROID ARM64 NEON BUILD"
          echo "========================================"

          echo
          echo "Binary:"
          ls -lh prune-android-arm64-neon

          echo
          echo "NNUE:"
          ls -lh model.bin

          echo
          echo "SHA256:"
          sha256sum \
            prune-android-arm64-neon \
            model.bin

          echo
          echo "File:"
          file prune-android-arm64-neon

      # ============================================================
      # 19. Package artifact
      # ============================================================
      - name: Package artifact
        shell: bash
        run: |
          set -e

          mkdir -p android-artifact

          cp core/prune-android-arm64-neon \
            android-artifact/

          cp core/model.bin \
            android-artifact/

          cp core/nn-name.txt \
            android-artifact/

          sha256sum \
            android-artifact/prune-android-arm64-neon \
            android-artifact/model.bin \
            > android-artifact/SHA256SUMS.txt

          echo
          echo "Artifact:"
          ls -lah android-artifact

      # ============================================================
      # 20. Upload
      # ============================================================
      - name: Upload Android ARM64 NEON
        uses: actions/upload-artifact@v4
        with:
          name: prune-android-arm64-neon
          path: android-artifact
          if-no-files-found: error
