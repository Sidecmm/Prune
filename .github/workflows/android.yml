name: Build Prune Android ARM64

on:
  push:
    branches:
      - "**"

  workflow_dispatch:

jobs:
  android-arm64:
    name: Build ARM64 NEON
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ------------------------------------------------------------
      # Find the Makefile automatically
      # ------------------------------------------------------------
      - name: Find Makefile
        shell: bash
        run: |
          echo "Repository:"
          pwd
          echo

          echo "Files:"
          find . -maxdepth 3 -type f | sort | head -200
          echo

          MAKEFILE=$(find . -name Makefile -type f -print -quit)

          if [ -z "$MAKEFILE" ]; then
            echo "ERROR: No Makefile found."
            exit 1
          fi

          MAKE_DIR=$(dirname "$MAKEFILE")

          echo "Found Makefile: $MAKEFILE"
          echo "Make directory: $MAKE_DIR"

          echo "MAKE_DIR=$MAKE_DIR" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Android SDK / NDK
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"

      # ------------------------------------------------------------
      # Configure compiler
      # ------------------------------------------------------------
      - name: Configure Android toolchain
        shell: bash
        run: |
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

          echo "TOOLCHAIN=$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Verify ARM64 compiler
      # ------------------------------------------------------------
      - name: Check ARM64 compiler
        run: |
          "$TOOLCHAIN/bin/aarch64-linux-android24-clang++" --version

      # ------------------------------------------------------------
      # Check ARM SIMD features
      # ------------------------------------------------------------
      - name: Check ARM NEON features
        run: |
          echo "Compiler ARM feature macros:"

          "$TOOLCHAIN/bin/aarch64-linux-android24-clang++" \
            -march=armv8-a \
            -dM -E -x c++ /dev/null |
            grep -E \
            '__aarch64__|__ARM_NEON__|__ARM_FEATURE_DOTPROD|__ARM_FEATURE_MATMUL_INT8' \
            || true

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build Prune ARM64
        shell: bash
        run: |
          echo "Building from:"
          echo "$MAKE_DIR"

          cd "$MAKE_DIR"

          echo "Current directory:"
          pwd

          echo
          echo "Directory contents:"
          ls -la

          echo
          echo "Cleaning..."
          make clean || true

          echo
          echo "Building..."

          make -j2 \
            CXX="$TOOLCHAIN/bin/aarch64-linux-android24-clang++" \
            CC="$TOOLCHAIN/bin/aarch64-linux-android24-clang" \
            ARCH=armv8-a \
            OS=Android \
            EXE=prune-android-arm64 \
            OPT="-O3 -flto -funroll-loops"

      # ------------------------------------------------------------
      # Verify result
      # ------------------------------------------------------------
      - name: Check binary
        shell: bash
        run: |
          cd "$MAKE_DIR"

          echo "Checking binary..."

          file prune-android-arm64

          "$TOOLCHAIN/bin/llvm-readelf" -h prune-android-arm64

      # ------------------------------------------------------------
      # Package
      # ------------------------------------------------------------
      - name: Package binary
        shell: bash
        run: |
          cd "$MAKE_DIR"

          mkdir -p "$GITHUB_WORKSPACE/android-build"

          cp prune-android-arm64 \
             "$GITHUB_WORKSPACE/android-build/"

          tar -czf \
            "$GITHUB_WORKSPACE/prune-android-arm64.tar.gz" \
            -C "$GITHUB_WORKSPACE" \
            android-build

      # ------------------------------------------------------------
      # Upload build artifact
      # ------------------------------------------------------------
      - name: Upload Android ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: prune-android-arm64
          path: prune-android-arm64.tar.gz
