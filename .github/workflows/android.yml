name: Prune Android Build System Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -eux

          sudo apt-get update
          sudo apt-get install -y \
            file \
            tree \
            grep \
            findutils

      - name: Show repository structure
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "REPOSITORY ROOT"
          echo "========================================"

          pwd

          echo
          echo "Top-level files:"
          find . -maxdepth 1 -type f -print | sort

          echo
          echo "Top-level directories:"
          find . -maxdepth 1 -type d -print | sort

          echo
          echo "========================================"
          echo "FULL SOURCE TREE"
          echo "========================================"

          find . -maxdepth 4 -type f -print | sort

      - name: Find build files
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "BUILD SYSTEM FILES"
          echo "========================================"

          find . -type f \
            \( \
              -name 'Makefile' \
              -o -name 'makefile' \
              -o -name 'GNUmakefile' \
              -o -name 'CMakeLists.txt' \
              -o -name '*.mk' \
              -o -name 'build.sh' \
              -o -name '*.sh' \
              -o -name 'meson.build' \
              -o -name 'Cargo.toml' \
              -o -name '*.sln' \
              -o -name '*.vcxproj' \
            \) \
            -print | sort

      - name: Find Prune source files
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "PRUNE / C++ SOURCE FILES"
          echo "========================================"

          find . -type f \
            \( \
              -name '*.cpp' \
              -o -name '*.cc' \
              -o -name '*.cxx' \
              -o -name '*.hpp' \
              -o -name '*.h' \
            \) \
            -print | sort

      - name: Find SIMD files
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "SIMD FILES"
          echo "========================================"

          find . -type f \
            \( \
              -iname '*simd*' \
              -o -iname '*neon*' \
              -o -iname '*sse*' \
              -name 'permute.cpp' \
            \) \
            -print | sort

      - name: Find build commands and architecture flags
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "BUILD / ARCHITECTURE REFERENCES"
          echo "========================================"

          grep -RInE \
            --exclude-dir=.git \
            --exclude='*.md' \
            -- \
            'march=|m64|march=native|clang\+\+|g\+\+|CXXFLAGS|CFLAGS|ARCH|make |cmake |permute' \
            . \
            > build-references.txt \
            || true

          cat build-references.txt

      - name: Inspect likely build files
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "BUILD FILE CONTENT"
          echo "========================================"

          BUILD_FILES="$(find . -type f \
            \( \
              -name 'Makefile' \
              -o -name 'makefile' \
              -o -name 'GNUmakefile' \
              -o -name 'CMakeLists.txt' \
              -o -name '*.mk' \
              -o -name 'build.sh' \
            \) \
            -print)"

          if [ -z "$BUILD_FILES" ]; then
            echo "NO STANDARD BUILD FILE FOUND."
          else
            while IFS= read -r FILE; do
              echo
              echo "========================================"
              echo "FILE: $FILE"
              echo "========================================"
              sed -n '1,300p' "$FILE"
            done <<< "$BUILD_FILES"
          fi

      - name: Inspect SIMD header
        shell: bash
        run: |
          set -eux

          SIMD="$(find . \
            -type f \
            -name 'simd_definitions.hpp' \
            -print -quit)"

          if [ -n "$SIMD" ]; then
            echo "========================================"
            echo "SIMD HEADER: $SIMD"
            echo "========================================"

            sed -n '1,350p' "$SIMD"
          else
            echo "simd_definitions.hpp not found."
          fi

      - name: Inspect permute.cpp
        shell: bash
        run: |
          set -eux

          PERMUTE="$(find . \
            -type f \
            -name 'permute.cpp' \
            -print -quit)"

          if [ -n "$PERMUTE" ]; then
            echo "========================================"
            echo "PERMUTE: $PERMUTE"
            echo "========================================"

            sed -n '1,400p' "$PERMUTE"
          else
            echo "permute.cpp not found."
          fi

      - name: Search for model generation
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "MODEL GENERATION REFERENCES"
          echo "========================================"

          grep -RInE \
            --exclude-dir=.git \
            -- \
            'model\.bin|\.nnue|permute' \
            . \
            > model-references.txt \
            || true

          cat model-references.txt

      - name: Create diagnostic artifact
        shell: bash
        run: |
          set -eux

          mkdir -p diagnostic

          cp build-references.txt diagnostic/ 2>/dev/null || true
          cp model-references.txt diagnostic/ 2>/dev/null || true

          find . -maxdepth 4 -type f -print \
            | sort \
            > diagnostic/file-tree.txt

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: prune-build-system-diagnostic
          path: diagnostic/
