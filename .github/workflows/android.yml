name: Prune Android ARM64 NEON

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. DEPENDENCIES
      # ------------------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            clang \
            lld \
            make \
            python3 \
            curl \
            unzip \
            file \
            binutils \
            qemu-user-static

      # ------------------------------------------------------------
      # 3. ANDROID SDK / NDK
      # ------------------------------------------------------------
      - name: Install Android NDK
        shell: bash
        run: |
          set -eux

          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"

          echo "SDK root: $SDK_ROOT"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" \
              -type f \
              -name sdkmanager \
              2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-24" \
            "ndk;27.2.12479018"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 4. VERIFY SOURCE STRUCTURE
      # ------------------------------------------------------------
      - name: Verify Prune source
        shell: bash
        run: |
          set -eux

          test -f core/Makefile
          test -f core/simd_definitions.cpp
          test -f core/simd_definitions.hpp
          test -f core/permute.cpp
          test -f core/embeder.cpp
          test -f core/TranspositionTable.cpp

          echo
          echo "Prune source detected:"
          echo "  core/Makefile"
          echo "  core/simd_definitions.cpp"
          echo "  core/simd_definitions.hpp"
          echo "  core/permute.cpp"
          echo "  core/embeder.cpp"
          echo "  core/TranspositionTable.cpp"

      # ------------------------------------------------------------
      # 5. PATCH MAKEFILE
      #
      # The Prune Makefile contains -m64, which is invalid for AArch64.
      # Remove ONLY the hardcoded -m64 occurrences.
      # ------------------------------------------------------------
      - name: Patch Makefile for Android ARM64
        shell: bash
        run: |
          set -eux

          cd core

          python3 <<'PY'
          from pathlib import Path

          path = Path("Makefile")
          text = path.read_text()

          count = text.count(" -m64")

          print(f"Found hardcoded -m64 occurrences: {count}")

          if count:
              text = text.replace(" -m64", "")
              path.write_text(text)
              print(f"Removed {count} hardcoded -m64 occurrences.")
          else:
              print("No hardcoded -m64 found. Nothing to change.")
          PY

          echo
          echo "Remaining -m64:"
          grep -nF -- "-m64" Makefile || true

      # ------------------------------------------------------------
      # 6. PATCH ALIGNED ALLOCATION
      # ------------------------------------------------------------
      - name: Patch Android aligned allocation
        shell: bash
        run: |
          set -eux

          cd core

          python3 <<'PY'
          from pathlib import Path

          path = Path("TranspositionTable.cpp")
          text = path.read_text()

          old = "table = (Cluster*)std::aligned_alloc(alignment, size);"

          new = """void* ptr = nullptr;

          if (posix_memalign(&ptr, alignment, size) != 0) {
              ptr = nullptr;
          }

          table = static_cast<Cluster*>(ptr);"""

          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print("Patched std::aligned_alloc -> posix_memalign")
          elif "posix_memalign(&ptr" in text:
              print("posix_memalign patch already present.")
          else:
              print("WARNING: expected aligned_alloc line not found.")
              print("No allocation patch was applied.")
          PY

      # ------------------------------------------------------------
      # 7. INSPECT EMBEDDER ALIGNMENT
      #
      # IMPORTANT:
      # Do NOT fail just because ".align 64" is absent.
      #
      # The previous workflow failed here even though the source did
      # not contain that exact text.
      # ------------------------------------------------------------
      - name: Inspect embeder alignment
        shell: bash
        run: |
          set -eux

          cd core

          echo "=================================================="
          echo "Alignment directives in embeder.cpp"
          echo "=================================================="

          grep -nEi \
            '\.(align|p2align|balign)[[:space:]]+' \
            embeder.cpp || true

          echo
          echo "=================================================="
          echo "Relevant ARM / assembly lines"
          echo "=================================================="

          grep -nEi \
            'asm|__asm|\.align|\.p2align|\.balign|section|global|globl' \
            embeder.cpp || true

          echo
          echo "No blind .align 64 replacement will be performed."
          echo "The source must first show an actual incompatible directive."

      # ------------------------------------------------------------
      # 8. HOST NATIVE PERMUTER
      #
      # The permuter is a BUILD-TIME utility.
      # Build it for x86_64 host instead of Android ARM64.
      # This avoids trying to execute an Android binary under QEMU.
      # ------------------------------------------------------------
      - name: Build host permuter
        shell: bash
        run: |
          set -eux

          cd core

          clang++ \
            -std=gnu++17 \
            -O3 \
            -march=native \
            -flto \
            -funroll-loops \
            -D_CRT_SECURE_NO_WARNINGS \
            -I. \
            permute.cpp \
            -o permute

          file permute

          ./permute --help || true

      # ------------------------------------------------------------
      # 9. DOWNLOAD PRUNE NETWORK
      # ------------------------------------------------------------
      - name: Download Prune network
        shell: bash
        run: |
          set -eux

          cd core

          if [ ! -f pulsar.bin ]; then
            echo "Downloading pulsar.bin..."

            curl -L \
              --fail \
              --retry 5 \
              --retry-delay 3 \
              -o pulsar.bin \
              "https://github.com/tgirolami09/Prune-nets/releases/download/pulsar/pulsar.bin"
          else
            echo "pulsar.bin already exists."
          fi

          ls -lh pulsar.bin

      # ------------------------------------------------------------
      # 10. GENERATE MODEL.BIN ON HOST
      # ------------------------------------------------------------
      - name: Generate model.bin with host permuter
        shell: bash
        run: |
          set -eux

          cd core

          rm -f model.bin

          ./permute pulsar.bin model.bin

          test -s model.bin

          echo
          echo "Generated model.bin:"
          ls -lh model.bin

          file model.bin

      # ------------------------------------------------------------
      # 11. ANDROID TOOLCHAIN
      # ------------------------------------------------------------
      - name: Configure Android ARM64 compiler
        shell: bash
        run: |
          set -eux

          NDK="$ANDROID_NDK_ROOT"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export CC="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"

          echo "CC=$CC"
          echo "CXX=$CXX"

          test -x "$CC"
          test -x "$CXX"

          "$CXX" --version

          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 12. ARM64 NEON COMPILER TEST
      # ------------------------------------------------------------
      - name: Test ARM64 NEON compiler
        shell: bash
        run: |
          set -eux

          cat > /tmp/neon_test.cpp <<'CPP'
          #include <arm_neon.h>

          int main() {
              uint8x16_t a = vdupq_n_u8(1);
              uint8x16_t b = vdupq_n_u8(2);
              uint8x16_t c = vaddq_u8(a, b);

              return vget_lane_u8(vget_low_u8(c), 0) == 3 ? 0 : 1;
          }
          CPP

          "$CXX" \
            -march=armv8.2-a+dotprod \
            -D__ARM_NEON__ \
            -flax-vector-conversions \
            /tmp/neon_test.cpp \
            -o /tmp/neon_test

          file /tmp/neon_test

          readelf -h /tmp/neon_test | grep -E \
            'Class:|Machine:'

      # ------------------------------------------------------------
      # 13. TEST PRUNE SIMD HEADER
      # ------------------------------------------------------------
      - name: Test Prune SIMD headers
        shell: bash
        run: |
          set -eux

          cd core

          cat > /tmp/prune_simd_test.cpp <<'CPP'
          #include "simd_definitions.hpp"

          int main() {
              return 0;
          }
          CPP

          "$CXX" \
            -std=gnu++17 \
            -O3 \
            -march=armv8.2-a+dotprod \
            -D__ARM_NEON__ \
            -flax-vector-conversions \
            -I. \
            -I../Fathom/src \
            -c \
            /tmp/prune_simd_test.cpp \
            -o /tmp/prune_simd_test.o

          echo "Prune SIMD header compiled successfully for ARM64 NEON."

      # ------------------------------------------------------------
      # 14. CLEAN OLD OBJECTS
      #
      # Do not use make -B because that could force unnecessary
      # regeneration of model.bin / permute.
      # ------------------------------------------------------------
      - name: Clean previous objects
        shell: bash
        run: |
          set -eux

          cd core

          make clean || true

          rm -f prune
          rm -f *.o
          rm -f *.d

          test -s model.bin

      # ------------------------------------------------------------
      # 15. BUILD PRUNE
      # ------------------------------------------------------------
      - name: Build Prune Android ARM64 NEON DotProd
        shell: bash
        run: |
          set -eux

          cd core

          export CC="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export CXX="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"

          make prune \
            ARCH="armv8.2-a+dotprod" \
            CPUSET="unknow" \
            ADDOPTION="-D__ARM_NEON__ -flax-vector-conversions"

      # ------------------------------------------------------------
      # 16. VERIFY FINAL ELF
      # ------------------------------------------------------------
      - name: Verify Android binary
        shell: bash
        run: |
          set -eux

          cd core

          test -x prune

          echo "=================================================="
          echo "FILE"
          echo "=================================================="

          file prune

          echo
          echo "=================================================="
          echo "ELF HEADER"
          echo "=================================================="

          readelf -h prune | grep -E \
            'Class:|Machine:|OS/ABI:|Type:'

          echo
          echo "=================================================="
          echo "NEON / ARM64 DISASSEMBLY CHECK"
          echo "=================================================="

          llvm-objdump -d prune > /tmp/prune.disasm

          grep -Ei \
            'addv|fmla|fmls|umlal|umlsl|sdot|udot|cnt|tbl|zip|uzp|ext|ld1|st1' \
            /tmp/prune.disasm \
            | head -n 100 || true

      # ------------------------------------------------------------
      # 17. CHECK NETWORK EMBEDDING
      # ------------------------------------------------------------
      - name: Verify embedded network
        shell: bash
        run: |
          set -eux

          cd core

          echo "Searching binary for network-related symbols/strings..."

          strings prune | grep -Ei \
            'pulsar|model|nnue|network|prune' \
            | head -n 100 || true

          echo
          echo "Binary size:"
          ls -lh prune

          echo
          echo "Model size:"
          ls -lh model.bin

      # ------------------------------------------------------------
      # 18. CHECK DYNAMIC DEPENDENCIES
      # ------------------------------------------------------------
      - name: Inspect Android dependencies
        shell: bash
        run: |
          set -eux

          cd core

          echo "=================================================="
          echo "DYNAMIC SECTION"
          echo "=================================================="

          readelf -d prune || true

          echo
          echo "=================================================="
          echo "NEEDED LIBRARIES"
          echo "=================================================="

          readelf -d prune \
            | grep NEEDED \
            || true

      # ------------------------------------------------------------
      # 19. PACKAGE ARTIFACT
      # ------------------------------------------------------------
      - name: Prepare artifact
        shell: bash
        run: |
          set -eux

          mkdir -p artifact

          cp core/prune artifact/prune-android-arm64-neon-dotprod

          chmod +x artifact/prune-android-arm64-neon-dotprod

          file artifact/prune-android-arm64-neon-dotprod

          sha256sum artifact/prune-android-arm64-neon-dotprod

      - name: Upload Android binary
        uses: actions/upload-artifact@v4
        with:
          name: prune-android-arm64-neon-dotprod
          path: artifact/prune-android-arm64-neon-dotprod

      # ------------------------------------------------------------
      # 20. AUTO-COMMIT SOURCE PATCHES
      #
      # Any source modifications made by the workflow are committed
      # and pushed back to the branch automatically.
      #
      # [skip ci] prevents the automatic commit from starting the
      # workflow again.
      # ------------------------------------------------------------
      - name: Auto-commit and push patches
        if: always()
        shell: bash
        run: |
          set -eux

          echo "Checking repository changes..."

          git status --short

          if git diff --quiet && \
             git diff --cached --quiet && \
             [ -z "$(git status --porcelain)" ]; then

            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add core/Makefile
          git add core/TranspositionTable.cpp
          git add core/embeder.cpp

          if git diff --cached --quiet; then
            echo "No tracked source patches to commit."
            exit 0
          fi

          git commit \
            -m "Auto-patch Prune for Android ARM64 [skip ci]"

          git push

          echo
          echo "=================================================="
          echo "PATCHES PUSHED SUCCESSFULLY"
          echo "=================================================="
