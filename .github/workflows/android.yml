name: Prune Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "core/**"
      - "Fathom/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    name: Android ARM64 NEON
    runs-on: ubuntu-24.04

    env:
      ANDROID_API: "24"
      NDK_VERSION: "27.2.12479018"

    steps:

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            make \
            curl \
            file \
            binutils-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            qemu-user-static \
            perl

      # ------------------------------------------------------------
      # ANDROID SDK
      # ------------------------------------------------------------

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          else
            echo "ERROR: Android SDK was not found."
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "Android SDK:"
          echo "$SDK"

      - name: Locate sdkmanager
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null \
            | sort \
            | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version

      - name: Accept Android licenses
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "Android licenses accepted."

      - name: Install Android NDK
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${NDK_VERSION}"

      - name: Verify NDK
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

          test -d "$NDK"

          echo "NDK:"
          echo "$NDK"

      # ------------------------------------------------------------
      # ANDROID TOOLCHAIN
      # ------------------------------------------------------------

      - name: Configure Android toolchain
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CC="$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang"
          CXX="$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang++"
          AR="$TOOLCHAIN/llvm-ar"
          STRIP="$TOOLCHAIN/llvm-strip"

          test -x "$CC"
          test -x "$CXX"

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "ANDROID_CC=$CC" >> "$GITHUB_ENV"
          echo "ANDROID_CXX=$CXX" >> "$GITHUB_ENV"
          echo "ANDROID_AR=$AR" >> "$GITHUB_ENV"
          echo "ANDROID_STRIP=$STRIP" >> "$GITHUB_ENV"

          echo "CC=$CC"
          echo "CXX=$CXX"

      - name: Verify Android ARM64 compiler
        shell: bash
        run: |
          set -e

          echo "Android compiler:"
          "$ANDROID_CXX" --version

          echo
          echo "Target:"

          TARGET=$("$ANDROID_CXX" -dumpmachine)

          echo "$TARGET"

          echo "$TARGET" | grep -Eq '^aarch64-(unknown-)?linux-android'

          echo
          echo "PASS: Android ARM64 compiler detected."

      # ------------------------------------------------------------
      # NNUE
      # ------------------------------------------------------------

      - name: Download Prune NNUE
        working-directory: core
        shell: bash
        run: |
          set -e

          RELEASE=$(head -n 1 nn-name.txt)
          NETNAME=$(tail -n 1 nn-name.txt)

          echo "Release:"
          echo "$RELEASE"

          echo
          echo "Network:"
          echo "$NETNAME"

          curl -fL \
            -o "${NETNAME}.bin" \
            "https://github.com/tgirolami09/Prune-nets/releases/download/${RELEASE}/${NETNAME}.bin"

          test -s "${NETNAME}.bin"

          echo
          echo "Downloaded NNUE:"
          ls -lh "${NETNAME}.bin"

          echo
          echo "SHA256:"
          sha256sum "${NETNAME}.bin"

      # ------------------------------------------------------------
      # HOST AARCH64 COMPILER
      # ------------------------------------------------------------

      - name: Verify ARM64 host compiler
        shell: bash
        run: |
          set -e

          echo "AArch64 compiler:"
          aarch64-linux-gnu-g++ --version

          echo
          echo "Target:"
          aarch64-linux-gnu-g++ -dumpmachine

      - name: Verify ARM NEON macros
        shell: bash
        run: |
          set -e

          echo "Checking ARM NEON predefined macros..."

          aarch64-linux-gnu-g++ \
            -march=armv8-a+simd \
            -dM \
            -E \
            -x c++ \
            /dev/null \
            | grep -E \
              '__aarch64__|__ARM_NEON|__ARM_NEON_FP'

          echo
          echo "PASS: ARM NEON macros are available."

      # ------------------------------------------------------------
      # SIMD SOURCE CHECK
      # ------------------------------------------------------------

      - name: Inspect Prune SIMD definitions
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Relevant SIMD definitions:"

          grep -n \
            -E \
            "__ARM_NEON__|__aarch64__|SSE2|_simd|using simd" \
            simd_definitions.hpp \
            | head -80 \
            || true

      # ------------------------------------------------------------
      # ARM PERMUTE
      #
      # IMPORTANT:
      # model.bin is generated by the ARM executable under QEMU.
      # This prevents the x86 GitHub runner from generating an
      # architecture-specific NNUE permutation.
      # ------------------------------------------------------------

      - name: Build ARM64 NEON permute
        working-directory: core
        shell: bash
        run: |
          set -e

          rm -f permute-arm64

          echo "Building ARM64 NEON permute utility..."

          aarch64-linux-gnu-g++ \
            -O3 \
            -std=gnu++17 \
            -march=armv8-a+simd \
            -D__ARM_NEON__ \
            -flax-vector-conversions \
            -static \
            -o permute-arm64 \
            permute.cpp

          chmod +x permute-arm64

          echo
          echo "permute-arm64:"
          file permute-arm64

          echo
          echo "ELF header:"

          readelf -h permute-arm64 \
            | grep -E \
              "Class:|Machine:|Type:"

      - name: Generate ARM NEON model.bin
        working-directory: core
        shell: bash
        run: |
          set -e

          NETNAME=$(tail -n 1 nn-name.txt)

          rm -f model.bin

          echo "Running ARM64 permute through QEMU..."

          qemu-aarch64-static \
            ./permute-arm64 \
            "${NETNAME}.bin" \
            model.bin

          test -s model.bin

          echo
          echo "Generated model.bin:"
          ls -lh model.bin

          echo
          echo "SHA256:"
          sha256sum model.bin

      # ------------------------------------------------------------
      # MAKEFILE
      # ------------------------------------------------------------

      - name: Backup Makefile
        working-directory: core
        shell: bash
        run: |
          set -e

          cp Makefile Makefile.android.original

          echo "Original Makefile backed up."

      - name: Remove x86 host architecture flags
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ORIGINAL ARCHITECTURE FLAGS"
          echo "========================================"

          grep -n \
            -E \
            -- "-m64|-march=native" \
            Makefile \
            || true

          echo
          echo "Removing x86-specific flags..."

          # Remove -m64 wherever it occurs.
          perl -0pi -e 's/(^|[[:space:]])-m64(?=[[:space:]]|$)/$1/g' Makefile

          # Remove -march=native wherever it occurs.
          perl -0pi -e 's/(^|[[:space:]])-march=native(?=[[:space:]]|$)/$1/g' Makefile

          echo
          echo "========================================"
          echo "VERIFYING CLEAN MAKEFILE"
          echo "========================================"

          echo
          echo "Remaining -m64:"
          if grep -n -- "-m64" Makefile; then
            echo
            echo "ERROR: -m64 still exists in Makefile."
            exit 1
          else
            echo "NONE"
          fi

          echo
          echo "Remaining -march=native:"
          if grep -n -- "-march=native" Makefile; then
            echo
            echo "ERROR: -march=native still exists in Makefile."
            exit 1
          else
            echo "NONE"
          fi

          echo
          echo "Architecture flags after cleanup:"

          grep -n \
            -E \
            -- "-march=|-mcpu=|-m64" \
            Makefile \
            || true

          echo
          echo "PASS: x86-specific architecture flags removed."

      # ------------------------------------------------------------
      # CLEAN
      # ------------------------------------------------------------

      - name: Clean build
        working-directory: core
        shell: bash
        run: |
          set -e

          make clean || true

          find . -type f \
            \( -name "*.o" -o -name "*.a" \) \
            -delete

          rm -f prune
          rm -f prune-android-arm64-neon

          test -s model.bin

      # ------------------------------------------------------------
      # BUILD
      # ------------------------------------------------------------

      - name: Compile Prune Android ARM64 NEON
        working-directory: core
        shell: bash
        run: |
          set -e

          export CC="$ANDROID_CC"
          export CXX="$ANDROID_CXX"

          CFLAGS="\
          -O3 \
          -flto \
          -funroll-loops \
          -march=armv8.2-a+dotprod \
          -fPIC"

          CXXFLAGS="\
          -O3 \
          -flto \
          -funroll-loops \
          -march=armv8.2-a+dotprod \
          -fPIC"

          LDFLAGS="\
          -flto \
          -march=armv8.2-a+dotprod \
          -static-libstdc++"

          echo "CC:"
          echo "$CC"

          echo
          echo "CXX:"
          echo "$CXX"

          echo
          echo "CFLAGS:"
          echo "$CFLAGS"

          echo
          echo "CXXFLAGS:"
          echo "$CXXFLAGS"

          echo
          echo "LDFLAGS:"
          echo "$LDFLAGS"

          echo
          echo "========================================"
          echo "FINAL MAKEFILE CHECK"
          echo "========================================"

          if grep -n -- "-march=native" Makefile; then
            echo "ERROR: -march=native is still present."
            exit 1
          fi

          if grep -n -- "-m64" Makefile; then
            echo "ERROR: -m64 is still present."
            exit 1
          fi

          echo "PASS: no -march=native"
          echo "PASS: no -m64"

          echo
          echo "========================================"
          echo "STARTING PRUNE COMPILATION"
          echo "========================================"

          make -B prune \
            CC="$CC" \
            CXX="$CXX" \
            CFLAGS="$CFLAGS" \
            CXXFLAGS="$CXXFLAGS" \
            LDFLAGS="$LDFLAGS"

      # ------------------------------------------------------------
      # LOCATE BINARY
      # ------------------------------------------------------------

      - name: Locate Prune binary
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Core directory:"
          ls -lah

          PRUNE=$(find . -maxdepth 1 \
            -type f \
            -name "prune*" \
            ! -name "*.o" \
            ! -name "*.d" \
            ! -name "*.bin" \
            ! -name "permute*" \
            | head -n 1)

          if [ -z "$PRUNE" ]; then
            echo "ERROR: Prune executable was not found."
            exit 1
          fi

          echo
          echo "Found:"
          echo "$PRUNE"

          cp "$PRUNE" prune-android-arm64-neon

          chmod +x prune-android-arm64-neon

      # ------------------------------------------------------------
      # ELF VALIDATION
      # ------------------------------------------------------------

      - name: Verify AArch64 ELF
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Binary:"
          file prune-android-arm64-neon

          echo
          echo "ELF header:"

          readelf -h prune-android-arm64-neon \
            | grep -E \
              "Class:|Data:|Type:|Machine:"

          MACHINE=$(readelf -h prune-android-arm64-neon \
            | awk -F: '/Machine:/ {print $2}')

          echo
          echo "Machine:"
          echo "$MACHINE"

          echo "$MACHINE" | grep -qi "AArch64"

          echo
          echo "PASS: binary is AArch64."

      - name: Inspect binary dependencies
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Dynamic dependencies:"

          readelf -d prune-android-arm64-neon \
            | grep NEEDED \
            || true

          echo
          echo "Architecture attributes:"

          readelf -A prune-android-arm64-neon \
            || true

      # ------------------------------------------------------------
      # SIMD VALIDATION
      # ------------------------------------------------------------

      - name: Inspect ARM NEON instructions
        working-directory: core
        shell: bash
        run: |
          set -e

          echo "Searching for ARM SIMD instructions..."

          aarch64-linux-gnu-objdump \
            -d \
            prune-android-arm64-neon \
            | grep -E \
              "sdot|udot|addv|ld1|st1|smull|smlal|umull|umlal" \
            | head -50 \
            || true

      # ------------------------------------------------------------
      # FINAL VALIDATION
      # ------------------------------------------------------------

      - name: Final validation
        working-directory: core
        shell: bash
        run: |
          set -e

          test -x prune-android-arm64-neon
          test -s model.bin

          echo
          echo "=============================================="
          echo " PRUNE ANDROID ARM64 NEON BUILD SUCCESS"
          echo "=============================================="

          echo
          echo "Binary:"
          ls -lh prune-android-arm64-neon

          echo
          echo "Model:"
          ls -lh model.bin

          echo
          echo "SHA256:"

          sha256sum \
            prune-android-arm64-neon \
            model.bin

          echo
          echo "File:"

          file prune-android-arm64-neon

      # ------------------------------------------------------------
      # PACKAGE
      # ------------------------------------------------------------

      - name: Package Android build
        shell: bash
        run: |
          set -e

          mkdir -p android-artifact

          cp core/prune-android-arm64-neon \
            android-artifact/

          cp core/model.bin \
            android-artifact/

          cp core/nn-name.txt \
            android-artifact/

          sha256sum \
            android-artifact/prune-android-arm64-neon \
            android-artifact/model.bin \
            > android-artifact/SHA256SUMS.txt

          echo
          echo "Artifact contents:"

          ls -lah android-artifact

      - name: Upload Android ARM64 NEON
        uses: actions/upload-artifact@v4
        with:
          name: prune-android-arm64-neon
          path: android-artifact/
          if-no-files-found: error
