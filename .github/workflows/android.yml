name: Build Prune Android ARM64

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  android-arm64:
    name: Build ARM64 NEON
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Find Makefile
        shell: bash
        run: |
          echo "Repository:"
          pwd

          MAKEFILE=$(find . -name Makefile -type f -print -quit)

          if [ -z "$MAKEFILE" ]; then
            echo "ERROR: No Makefile found."
            exit 1
          fi

          MAKE_DIR=$(dirname "$MAKEFILE")

          echo "Found Makefile: $MAKEFILE"
          echo "Make directory: $MAKE_DIR"

          echo "MAKE_DIR=$MAKE_DIR" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"

      - name: Configure Android toolchain
        run: |
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

          echo "TOOLCHAIN=$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64" >> "$GITHUB_ENV"

      - name: Check ARM64 compiler
        run: |
          "$TOOLCHAIN/bin/aarch64-linux-android24-clang++" --version

      - name: Check ARM features
        run: |
          "$TOOLCHAIN/bin/aarch64-linux-android24-clang++" \
            -march=armv8-a \
            -dM -E -x c++ /dev/null |
            grep -E \
            '__aarch64__|__ARM_NEON__|__ARM_FEATURE_DOTPROD|__ARM_FEATURE_MATMUL_INT8' \
            || true

      - name: Build Prune
        shell: bash
        run: |
          cd "$MAKE_DIR"

          echo "Building in:"
          pwd

          make clean || true

          make -j2 \
            CXX="$TOOLCHAIN/bin/aarch64-linux-android24-clang++" \
            CC="$TOOLCHAIN/bin/aarch64-linux-android24-clang" \
            ARCH=armv8-a \
            OS=Android \
            OPT="-O3 -flto -funroll-loops"

      - name: Find compiled binary
        shell: bash
        run: |
          cd "$MAKE_DIR"

          echo "Build directory:"
          pwd

          echo
          echo "Files produced by compilation:"
          find . -maxdepth 1 -type f -executable -printf '%f\n' || true

          echo
          echo "All files:"
          ls -lah

          BINARY=$(find . -maxdepth 1 -type f -executable \
            ! -name "*.sh" \
            ! -name "*.py" \
            -print -quit)

          if [ -z "$BINARY" ]; then
            echo "ERROR: Could not find compiled executable."
            exit 1
          fi

          BINARY=$(realpath "$BINARY")

          echo "Found binary:"
          echo "$BINARY"

          echo "BINARY=$BINARY" >> "$GITHUB_ENV"

      - name: Check ARM64 binary
        shell: bash
        run: |
          echo "Checking:"
          echo "$BINARY"

          file "$BINARY"

          "$TOOLCHAIN/bin/llvm-readelf" -h "$BINARY"

      - name: Package binary
        shell: bash
        run: |
          mkdir -p android-build

          cp "$BINARY" android-build/prune-android-arm64

          tar -czf prune-android-arm64.tar.gz \
            android-build

      - name: Upload Android ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: prune-android-arm64
          path: prune-android-arm64.tar.gz
